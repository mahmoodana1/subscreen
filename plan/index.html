<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Plan">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Plan</title>
<style>
/* The iPhone's calendar and tasks: taskvim's data, edited from the phone. Same black glass as the
   subscreen (true black, greys, hairlines, one accent), but its own app: portrait, made for thumbs.
   Calendar: a week strip over the chosen day's agenda. Tasks: taskvim's dashboard sections. */
:root{
  --bg:#000; --text:#dedede; --sub:#969696; --muted:#606060; --faint:#2c2c2c; --hair:#1c1c1c; --sel:#141414;
  --accent:#94e2d5;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Manrope",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:16px/1.35 var(--f);-webkit-text-size-adjust:100%;touch-action:manipulation}
body{overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.app{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;--side:max(16px,calc((100vw - 680px) / 2));--l:calc(env(safe-area-inset-left,0px) + var(--side));--r:calc(env(safe-area-inset-right,0px) + var(--side))}

/* ---------- header + week strip ---------- */
header{padding:calc(env(safe-area-inset-top,0px) + 14px) var(--r) 0 var(--l);position:relative;z-index:12;background:var(--bg)}
.top{display:flex;align-items:baseline;gap:8px;height:40px}
.mbtn{display:flex;align-items:baseline;gap:8px}
.month{font-size:28px;font-weight:700;letter-spacing:-.02em}
.year{font-size:28px;font-weight:300;color:var(--muted)}
.mbtn .caret{width:9px;height:9px;border:solid var(--muted);border-width:0 1.5px 1.5px 0;transform:translateY(-4px) rotate(45deg);margin-left:2px;transition:transform .2s}
.mbtn.open .caret{transform:translateY(0) rotate(-135deg)}
.mbtn.static .caret{display:none}
.top .sp{flex:1}
.off{font-size:12px;color:var(--muted)}
.today{font-size:13px;color:var(--sub);padding:6px 0 6px 10px}
.strip{display:grid;grid-template-columns:repeat(7,1fr);margin:6px -6px 0;padding-bottom:8px;border-bottom:1px solid var(--hair);touch-action:pan-y}
.day{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0 2px;border-radius:12px;transition:background .15s}
.day .w{font-size:11px;color:var(--muted);letter-spacing:.04em}
.day .n{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;font-size:17px;font-variant-numeric:tabular-nums;color:var(--sub);transition:background .15s,color .15s}
.day.is-today .n{color:var(--accent)}
.day.on .n{background:var(--text);color:#000;font-weight:600}
.day .dots{display:flex;gap:2px;height:4px}
.day .dots i{width:4px;height:4px;border-radius:50%;background:var(--faint)}
.day.drop{background:var(--sel)}
.day.drop .n{box-shadow:inset 0 0 0 1px var(--accent)}

/* ---------- pages ---------- */
main{position:relative;overflow:hidden}
.page{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 var(--r) 120px var(--l);overscroll-behavior:contain;overflow-x:hidden;scrollbar-width:none}
.page::-webkit-scrollbar{display:none}
.slide-l{animation:slideL .22s cubic-bezier(.2,.8,.3,1)}
.slide-r{animation:slideR .22s cubic-bezier(.2,.8,.3,1)}
@keyframes slideL{from{transform:translateX(24px);opacity:.3}}
@keyframes slideR{from{transform:translateX(-24px);opacity:.3}}
.dtitle{font-size:14px;color:var(--muted);margin:16px 0 6px;letter-spacing:.02em}
.sec{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:22px 0 4px;display:flex;justify-content:space-between}
.empty{color:var(--muted);font-size:14px;padding:28px 0 8px}

/* an agenda row: time, then what. Tasks carry a ring to tick; classes and events a hairline */
.list{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.item{display:flex;align-items:stretch;gap:12px;padding:11px 0;border-bottom:1px solid var(--hair);position:relative;background:var(--bg);transition:opacity .3s}
.item .when{width:50px;flex:none;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;padding-top:1px}
.item .when b{font-weight:500;font-size:16px}
.item .when span{font-size:13px;color:var(--muted)}
.item .body{flex:1;min-width:0;border-left:2px solid var(--faint);padding-left:10px}
.item.event .body{border-left-color:var(--sub)}
.item.task .body{border-left-color:transparent;padding-left:0}
.item .t{font-size:16.5px;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow-wrap:anywhere}
.item .n{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.item.past .when,.item.past .t{color:var(--muted)}
.chk{width:24px;height:24px;flex:none;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--muted);align-self:center;position:relative;transition:box-shadow .2s,background .2s}
.chk::after{content:"";position:absolute;left:8.5px;top:5px;width:5px;height:10px;border:solid #000;border-width:0 2px 2px 0;transform:rotate(45deg);opacity:0}
.done .chk{background:var(--accent);box-shadow:none}
.done .chk::after{opacity:1}
.done .t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.item.untimed{padding:10px 0}
.item .meta{font-size:13.5px;color:var(--muted);align-self:center;white-space:nowrap;flex:none}
.now{height:0;border-top:1px solid var(--accent);position:relative;margin:-1px 0 0 50px}
.now::before{content:"";position:absolute;left:-4px;top:-4px;width:7px;height:7px;border-radius:50%;background:var(--accent)}

/* swiping a task right ticks it: a quiet accent ring follows from the left */
.item.swiping{transition:none;overflow:hidden}
.swipe-bg{position:absolute;left:0;top:0;bottom:0;display:flex;align-items:center;padding-left:4px;pointer-events:none;opacity:0}
.swipe-bg b{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--accent);transition:background .15s}
.swipe-bg.go b{background:var(--accent)}

/* dragging: the row lifts and follows the finger; the time it would land on shows in place */
.item.lift{z-index:5;background:#0b0b0b;box-shadow:0 10px 30px rgba(0,0,0,.8),inset 0 0 0 1px var(--faint);border-radius:12px;padding-left:8px;padding-right:8px;margin:0 -8px;transition:none}
.item.lift .when b{color:var(--accent)}
.gap{height:0;border-top:1px solid var(--accent);margin:-1px 0 0}

/* ---------- tab bar + add ---------- */
nav{display:flex;justify-content:center;gap:44px;padding:8px 0 calc(env(safe-area-inset-bottom,0px) + 6px);border-top:1px solid var(--hair);background:var(--bg)}
nav button{font-size:14px;min-width:72px;min-height:36px;color:var(--muted);padding:6px 4px;position:relative}
nav button.on{color:var(--text)}
nav button.on::after{content:"";position:absolute;left:30%;right:30%;bottom:0;height:1px;background:var(--text)}
.fab{position:fixed;right:calc(env(safe-area-inset-right,0px) + 18px);bottom:calc(env(safe-area-inset-bottom,0px) + 64px);width:56px;height:56px;border-radius:50%;background:rgba(18,18,18,.92);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:inset 0 0 0 1px var(--faint),0 10px 30px rgba(0,0,0,.7);display:grid;place-items:center;z-index:10}
.fab svg{width:22px;height:22px}
.fab:disabled{opacity:.35}

/* ---------- sheet: add and edit ---------- */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;left:max(0px,calc((100vw - 720px) / 2));right:max(0px,calc((100vw - 720px) / 2));bottom:var(--kb,0px);z-index:21;max-height:calc(100% - var(--kb,0px) - env(safe-area-inset-top,0px) - 8px);transition:bottom .25s;overflow-y:auto;background:rgba(12,12,12,.96);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:inset 0 1px 0 var(--faint);border-radius:18px 18px 0 0;padding:8px calc(env(safe-area-inset-right,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 18px) calc(env(safe-area-inset-left,0px) + 16px);animation:up .28s cubic-bezier(.2,.9,.25,1)}
@keyframes up{from{transform:translateY(100%)}}
.sheet .bar{display:flex;align-items:center;justify-content:space-between;height:44px}
.sheet .bar button{font-size:15px;color:var(--sub);padding:8px 0}
.sheet .bar .save{color:var(--accent);font-weight:600}
.sheet .bar .seg button{padding:6px 16px;font-size:13px}
.sheet .bar .save:disabled{opacity:.35}
.seg{display:flex;background:var(--sel);border-radius:9px;padding:2px;gap:2px}
.seg button{flex:1;font-size:13px;color:var(--sub);padding:6px 10px;border-radius:7px}
.seg button.on{background:#262626;color:var(--text)}
.title-in{width:100%;background:none;border:0;border-bottom:1px solid var(--hair);color:var(--text);font:500 20px/1.3 var(--f);padding:14px 0 12px;outline:none}
.title-in::placeholder{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;min-height:48px;border-bottom:1px solid var(--hair)}
.row label{flex:1;color:var(--sub);font-size:15px}
.row input,.row select{background:var(--sel);border:0;border-radius:8px;color:var(--text);font:16px var(--f);padding:6px 10px;min-height:34px;outline:none;-webkit-appearance:none;appearance:none}
.row input[type=text]{flex:1.4;min-width:0}
.row .x{color:var(--muted);font-size:13px;padding:6px 2px}
.row .seg{flex:none}
.days{display:flex;gap:6px;padding:10px 0;border-bottom:1px solid var(--hair)}
.days button{flex:1;height:34px;border-radius:9px;background:var(--sel);color:var(--sub);font-size:13px}
.days button.on{background:#262626;color:var(--text);box-shadow:inset 0 0 0 1px var(--faint)}
.acts{display:flex;gap:10px;margin-top:18px}
.acts button{flex:1;height:44px;border-radius:12px;background:var(--sel);color:var(--sub);font-size:15px}
.acts button.warn{color:#d9a0a8}
.chips{display:flex;gap:6px;padding:10px 0 2px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;height:32px;padding:0 12px;border-radius:16px;background:var(--sel);color:var(--sub);font-size:13.5px}
.chips button.on{background:#262626;color:var(--text);box-shadow:inset 0 0 0 1px var(--faint)}
.hint{font-size:12.5px;color:var(--muted);margin-top:12px}

.mpick{position:fixed;left:calc(env(safe-area-inset-left,0px) + 8px);right:calc(env(safe-area-inset-right,0px) + 8px);top:calc(env(safe-area-inset-top,0px) + 62px);max-width:420px;z-index:15;background:rgba(14,14,14,.97);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:inset 0 0 0 1px var(--faint),0 20px 60px rgba(0,0,0,.8);border-radius:16px;padding:10px 10px 12px;transform-origin:top left;animation:pop .2s cubic-bezier(.22,.9,.24,1)}
@keyframes pop{from{opacity:0;transform:scale(.96)}}
.mpick .mh{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 8px}
.mpick .mh b{font-weight:600;font-size:16px}
.mpick .mh button{width:40px;height:36px;display:grid;place-items:center;color:var(--sub);font-size:20px}
.mpick .mg{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px;text-align:center}
.mpick .mg span{font-size:11px;color:var(--muted);padding-bottom:4px}
.mpick .mg button{height:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:10px;font-size:15px;color:var(--sub);font-variant-numeric:tabular-nums}
.mpick .mg button i{width:4px;height:4px;border-radius:50%;background:transparent}
.mpick .mg button.has i{background:var(--faint)}
.mpick .mg button.is-today{color:var(--accent)}
.mpick .mg button.on{background:var(--text);color:#000;font-weight:600}
.mpick .mg button.on i{background:transparent}
.mpick .jump{display:block;margin:8px auto 0;font-size:13px;color:var(--sub);padding:6px 12px}
.shade{position:fixed;inset:0;z-index:14}

/* landscape on a phone: the header becomes one row, so the day keeps most of the height */
@media (orientation:landscape) and (max-height:500px){
  header{display:flex;align-items:center;gap:16px;padding-top:6px}
  .top{flex:none;height:auto}
  .month,.year{font-size:22px}
  .strip{flex:1;margin:0;padding-bottom:4px;border-bottom:0}
  .day{flex-direction:row;justify-content:center;gap:6px;padding:2px 0}
  .day .n{width:30px;height:30px;font-size:15px}
  .day .dots{display:none}
  main{border-top:1px solid var(--hair)}
  .dtitle{margin-top:10px}
  nav{padding-top:4px}
  .fab{bottom:calc(env(safe-area-inset-bottom,0px) + 54px);width:50px;height:50px}
  .mpick{top:calc(env(safe-area-inset-top,0px) + 44px);max-height:calc(100% - 52px);overflow-y:auto}
}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 128px);transform:translate(-50%,10px);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;background:#0d0d0d;box-shadow:inset 0 0 0 1px var(--faint);border-radius:12px;padding:10px 14px;font-size:13.5px;color:var(--sub);display:flex;gap:16px;align-items:center;z-index:30;max-width:calc(100% - 32px);white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--accent);font-weight:600}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="top"><button class="mbtn" id="mbtn" type="button"><span class="month" id="month"></span><span class="year" id="year"></span><i class="caret"></i></button><span class="sp"></span>
      <span class="off" id="off" hidden>Offline</span><button class="today" id="todayBtn" type="button" hidden>Today</button></div>
    <div class="strip" id="strip"></div>
  </header>
  <main>
    <section class="page" id="calPage"><div class="list" id="cal"></div></section>
    <section class="page" id="taskPage" hidden><div class="list" id="tasks"></div></section>
  </main>
  <nav><button type="button" data-tab="cal" class="on">Calendar</button><button type="button" data-tab="tasks">Tasks</button></nav>
</div>
<button class="fab" id="fab" type="button" aria-label="Add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<div class="shade" id="shade" hidden></div>
<div class="mpick" id="mpick" hidden></div>
<div class="veil" id="veil" hidden></div>
<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast"></div>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

/* ================= dates: plain YYYY-MM-DD strings, local time ================= */
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const between = (a, b) => Math.round((Date.UTC(...b.split('-').map((v, i) => i === 1 ? v - 1 : +v)) - Date.UTC(...a.split('-').map((v, i) => i === 1 ? v - 1 : +v))) / 864e5);
const todayISO = () => iso(new Date());
const nowHM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const toHM = m => { m = Math.max(0, Math.min(23 * 60 + 45, m)); return `${pad(Math.floor(m / 60))}:${pad(m % 60)}`; };
const WD = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
const weekStart = s => addDays(s, -parse(s).getDay());          // weeks start on Sunday, as in taskvim
function dayName(s) {
  const t = todayISO(), n = between(t, s);
  const long = parse(s).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
  return n === 0 ? `Today · ${long}` : n === 1 ? `Tomorrow · ${long}` : n === -1 ? `Yesterday · ${long}` : long;
}
function dueLabel(s) {
  const n = between(todayISO(), s);
  if (n === 0) return 'today';
  if (n === 1) return 'tomorrow';
  if (n < 0) return n === -1 ? 'yesterday' : parse(s).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  if (n < 7) return parse(s).toLocaleDateString('en-GB', { weekday: 'short' });
  return parse(s).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}

/* ================= the computers ================= */
// The page comes from one computer over `tailscale serve`; any of them can answer, since
// Syncthing keeps taskvim's file the same on all (add 'a73-hub' here if the always-on hub is set up).
// Edits are queued on the phone: each shows at once, and goes, in order, to whichever answers.
const TAILNET = location.protocol === 'https:' && location.hostname.endsWith('.ts.net') ? location.hostname.split('.').slice(1).join('.') : '';
const HOSTS = [...new Set([TAILNET ? location.hostname.split('.')[0] : '', ...load('plan-hosts', ['omarchy', 'archlinux'])])];
const base = h => !h || !TAILNET ? location.origin : `https://${h}.${TAILNET}`;
let S = load('plan-data', null), live = null;         // S: what a computer last sent
let Q = load('plan-queue', []);                        // edits not yet taken by a computer
let D = null;                                          // what is drawn: S with the queue on top

async function fetchJSON(url, opts = {}, ms = 4000) {
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), ms);
  try {
    const r = await fetch(url, { cache: 'no-store', ...opts, signal: ctl.signal });
    const body = await r.json().catch(() => ({}));
    if (!r.ok || body.error) { const e = new Error(body.error || `HTTP ${r.status}`); e.refused = r.status >= 400 && r.status < 500; throw e; }
    return body;
  } finally { clearTimeout(timer); }
}
function showState() {
  const off = $('#off');
  off.hidden = live != null && !Q.length;
  off.textContent = live == null ? (Q.length ? `Offline · ${Q.length} to sync` : 'Offline') : 'Syncing';
}
function redraw() {
  D = S ? structuredClone(S) : null;
  if (D) for (const op of Q) { try { apply(D, op); } catch {} }   // one the data no longer fits waits for the computer's verdict
  showState();
  if (!drag) render();
}
function take(data, host) {
  delete data.added;
  S = data; live = host; save('plan-data', data);
  redraw();
}
let syncing = false;
async function sync() {
  if (syncing || drag) return;
  syncing = true;
  try {
    for (const h of live != null ? [live, ...HOSTS.filter(x => x !== live)] : HOSTS) {
      try { const data = await fetchJSON(`${base(h)}/plan/data`); if (data.version !== S?.version || live !== h) take(data, h); flush(); watch(); return; } catch {}
    }
    live = null; showState();
  } finally { syncing = false; }
}
// one long request at a time to the computer in use: it answers the moment taskvim's file changes
let watching = null, watchGen = 0;
const noWatch = new Set();      // an agent from before /plan/watch: the 20 s poll does for it
async function watch() {
  if (watching === live || live == null || noWatch.has(live) || document.visibilityState !== 'visible') return;
  const h = watching = live, gen = ++watchGen;
  while (gen === watchGen && live === h && document.visibilityState === 'visible') {
    try {
      const data = await fetchJSON(`${base(h)}/plan/watch?v=${encodeURIComponent(S?.version ?? '')}`, {}, 32000);
      if (gen !== watchGen || live !== h) return;
      if (data.version !== S?.version && !flushing && !drag) take(data, h);
    } catch (e) {
      if (e.refused) noWatch.add(h);
      break;
    }
  }
  if (gen === watchGen) { watching = null; if (document.visibilityState === 'visible' && !noWatch.has(h)) setTimeout(sync, 3000); }
}
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
let tmpSeq = Math.min(-1, ...Q.map(o => o.tmp || 0)) - 1;
// show it now, keep it in the queue, send it when a computer answers
async function edit(op) {
  op = { ...op, qid: newId() };
  if (['task.add', 'event.add'].includes(op.op) || op.op === 'event.move' && D?.events.find(e => e.id === op.id)?.repeat) op.tmp = tmpSeq--;
  try { apply(structuredClone(D), op); } catch (e) { toast(esc(e.message)); return false; }
  Q.push(op); save('plan-queue', Q);
  redraw();
  flush();
  return true;
}
let flushing = false;
async function flush() {
  if (flushing || live == null || !Q.length) return;
  flushing = true; showState();
  try {
    while (Q.length && live != null) {
      const op = Q[0], h = live, { tmp, ...body } = op;
      let data;
      try {

      Object.assign(ev, { title: nameOf(op.title, 'title'), note: op.note || '', date: op.date, start, end, repeat: op.repeat || null });
      if (op.op === 'event.add') d.events.push(ev);

/* ================= what falls on a day ================= */
// calendar::occurs_on, so the phone and taskvim agree on every repeat

  for (const e of D.events) if (occurs(e, day)) timed.push({ kind: 'event', id: e.id, title: e.title, note: e.note, start: e.start, end: e.end, src: e });
  for (const t of D.tasks) {
    if (t.habit || t.done) continue;
    if (t.due === day) (t.start ? timed : untimed).push({ kind: 'task', id: t.id, title: t.text, note: course(t.project), start: t.start, end: t.end, src: t });

  } else if (f.kind === 'event') {
    const unit = f.repeat === 'week2' ? 'week' : f.repeat;
    op = { op: f.isNew ? 'event.add' : 'event.set', title: f.title, date: f.date, start: f.start, end: f.end, note: f.note,
      repeat: unit ? { unit, every: f.repeat === 'week2' ? 2 : 1, days: unit === 'week' ? f.days : [], until: f.until || null } : null };
  } else op = { op: 'class.set', title: f.title, start: f.start, end: f.end, note: f.note };   // the agent keeps only what differs from the feed
  if (!f.isNew) op.id = f.id;
  if (f.kind === 'task' && f.isNew) op.section = f.section;
  if (!f.isNew && f.kind === 'task') {   // a section change also moves it on the dashboard
    const t = D.tasks.find(x => x.id === f.id);
    if (t && t.section !== f.section && !await edit({ op: 'task.place', id: f.id, section: f.section })) return;
  }
  if (await edit(op)) {
    closeSheet();
    const target = f.kind === 'task' ? f.due : f.kind === 'event' ? f.date : null;
    if (f.isNew && target && tab === 'cal') goDay(target);
  }
}
$('#sheet').addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  readSheet();
  const a = b.dataset.a, f = form;
  if (b.dataset.k) { const keep = f.title; form = newForm(b.dataset.k); form.title = keep; return drawSheet(); }
  if (b.dataset.s) { f.section = b.dataset.s; return drawSheet(); }
  if ('due' in b.dataset) {
    if (f.kind === 'task') { f.due = b.dataset.due; if (!f.due) f.start = f.end = ''; }
    else f.date = b.dataset.due;
    return drawSheet();
  }
  if (b.dataset.len) { f.end = toHM(toMin(f.start) + +b.dataset.len); return drawSheet(); }
  if (b.dataset.wd) { const i = +b.dataset.wd; f.days = f.days.includes(i) ? f.days.filter(x => x !== i) : [...f.days, i].sort(); if (!f.days.length) f.days = [i]; return drawSheet(); }
  if (a === 'cancel') return closeSheet();
  if (a === 'save') return saveSheet();
  if (a === 'notime') { f.start = f.end = ''; return drawSheet(); }
  if (a === 'nountil') { f.until = ''; return drawSheet(); }
  if (a === 'done') { closeSheet(); return tick(f.id); }
  const sure = key => { if (f.confirm === key) return true; f.confirm = key; drawSheet(); return false; };
  if (a === 'del' && sure(f.repeating ? 'all' : true)) { if (await edit({ op: f.kind + '.delete', id: f.id })) { closeSheet(); toast('Deleted'); } }
  if (a === 'delone' && sure('one')) { if (await edit({ op: 'event.delete', id: f.id, date: f.on })) { closeSheet(); toast('Deleted for this day'); } }
  if (a === 'hide' && sure(true)) { if (await edit({ op: 'class.hide', id: f.id })) { closeSheet(); toast('Hidden'); } }
});
$('#sheet').addEventListener('change', e => {
  if (!['fDue', 'fRepeat', 'fStart', 'fUntil'].includes(e.target.id)) return;
  const hadStart = !!form.start;
  readSheet();
  if (e.target.id === 'fStart' && form.start && (!hadStart || !form.end || form.end <= form.start)) form.end = toHM(toMin(form.start) + 60);
  if (e.target.id === 'fStart' && $('#fEnd') && hadStart) { $('#fEnd').value = form.end; return; }
  drawSheet();
});
$('#veil').addEventListener('click', closeSheet);
$('#fab').addEventListener('click', () => openSheet(newForm(tab === 'tasks' ? 'task' : 'event')));

/* ================= taps ================= */
let suppressClick = false;
function onListClick(e) {
  if (suppressClick) { suppressClick = false; return; }
  const it = e.target.closest('.item'); if (!it || !D) return;
  if (e.target.closest('.chk')) return tick(+it.dataset.id, it);
  const f = editForm(it.dataset.kind, it.dataset.id);
  if (f) openSheet(f);
}
$('#cal').addEventListener('click', onListClick);
$('#tasks').addEventListener('click', onListClick);
$('#strip').addEventListener('click', e => { const b = e.target.closest('.day'); if (b && !suppressClick) { if (tab !== 'cal') setTab('cal'); goDay(b.dataset.day); } });
$('#todayBtn').addEventListener('click', () => goDay(todayISO()));
document.querySelector('nav').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setTab(b.dataset.tab); });

/* ================= swipes: the agenda by day, the strip by week ================= */
function swipe(el, fn) {
  let x0 = null, y0 = 0;
  el.addEventListener('touchstart', e => { if (e.touches.length === 1) { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; } }, { passive: true });
  el.addEventListener('touchend', e => {
    if (x0 == null || drag) return;
    const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;
    x0 = null;
    if (Math.abs(dx) > 60 && Math.abs(dy) < Math.abs(dx) * .6) fn(dx < 0 ? 1 : -1);
  }, { passive: true });
}
swipe($('#calPage'), n => goDay(addDays(day, n)));
swipe($('#strip'), n => goDay(addDays(day, 7 * n)));

/* ================= drag: hold, then move =================
   Calendar: up and down moves the time in quarter hours; over a day in the strip moves the day.
   Tasks: up and down moves it between and within the dashboard sections. */
let press = null, drag = null;
const pt = e => e.touches ? (e.touches[0] || e.changedTouches[0]) : e;
function down(e) {
  const it = e.target.closest('.item'); if (!it || e.target.closest('.chk') || !D) return;
  const p = pt(e);
  press = { it, x: p.clientX, y: p.clientY, timer: setTimeout(() => startDrag(), 380) };
}
function startDrag() {
  const { it, y } = press; press = null;
  const kind = it.dataset.kind, id = it.dataset.id, inCal = !!it.closest('#cal');
  const src = kind === 'task' ? D.tasks.find(t => t.id === +id) : kind === 'event' ? D.events.find(x => x.id === +id) : D.classes.find(c => c.id === id);
  drag = { it, kind, id, inCal, y0: y, src, timed: inCal && !it.classList.contains('untimed'), day, target: null };
  if (drag.timed) { drag.start = it.querySelector('.when b').textContent; drag.len = toMin(it.querySelector('.when span').textContent || drag.start) - toMin(drag.start); }
  it.classList.add('lift');
  suppressClick = true;
}
let swiping = null;
function move(e) {
  const p = pt(e);
  if (press && !swiping && press.it.closest('#tasks') && p.clientX - press.x > 10 && Math.abs(p.clientX - press.x) > 1.5 * Math.abs(p.clientY - press.y)) {
    clearTimeout(press.timer);
    press.it.insertAdjacentHTML('afterbegin', '<div class="swipe-bg"><b></b></div>');
    press.it.classList.add('swiping');
    swiping = { it: press.it, x0: press.x }; press = null; suppressClick = true;
  }
  if (swiping) {
    e.preventDefault();
    const dx = Math.max(0, p.clientX - swiping.x0), bg = swiping.it.querySelector('.swipe-bg');
    swiping.dx = dx;
    for (const c of swiping.it.children) if (c !== bg) c.style.transform = `translateX(${dx}px)`;
    bg.style.opacity = Math.min(1, dx / 60); bg.classList.toggle('go', dx > 90);
    return;
  }
  if (press && Math.hypot(p.clientX - press.x, p.clientY - press.y) > 8) { clearTimeout(press.timer); press = null; }
  if (!drag) return;
  e.preventDefault();
  const dy = p.clientY - drag.y0;
  drag.it.style.transform = `translateY(${dy}px)`;
  // over the strip: that day
  const over = document.elementFromPoint(p.clientX, p.clientY)?.closest('.day');
  document.querySelectorAll('.day.drop').forEach(b => b !== over && b.classList.remove('drop'));
  if (drag.inCal) {
    drag.dayTo = over && !(drag.kind === 'class') ? over.dataset.day : null;
    if (over && drag.kind !== 'class') over.classList.add('drop');
    if (drag.timed) {
      drag.newStart = drag.dayTo ? drag.start : toHM(toMin(drag.start) + Math.round(dy / 14) * 15);
      drag.it.querySelector('.when b').textContent = drag.newStart;
      drag.it.querySelector('.when span').textContent = toHM(toMin(drag.newStart) + drag.len);
    }
    return;
  }
  // the dashboard: find the gap the finger is over
  document.querySelector('.gap')?.remove();
  let section = null, before = null, gapAfter = null;
  for (const el of document.querySelectorAll('#tasks .sec, #tasks .item')) {
    if (el === drag.it) continue;
    const r = el.getBoundingClientRect();
    if (el.classList.contains('sec')) { if (r.top < p.clientY) { section = el.dataset.sec; before = null; gapAfter = el; } continue; }
    if (el.dataset.sec !== section) continue;
    if (p.clientY < r.top + r.height / 2) { before = +el.dataset.id; break; }
    gapAfter = el;
  }
  drag.target = section ? { section, before } : null;
  if (gapAfter) gapAfter.insertAdjacentHTML('afterend', '<div class="gap"></div>');
}
async function up(e) {
  if (press) { clearTimeout(press.timer); press = null; }
  if (swiping) {
    const { it, dx } = swiping; swiping = null;
    setTimeout(() => { suppressClick = false; }, 50);
    const reset = () => { it.classList.remove('swiping'); it.querySelector('.swipe-bg')?.remove(); for (const c of it.children) { c.style.transition = 'transform .2s'; c.style.transform = ''; } };
    if (dx > 90 && e.type !== 'touchcancel') { reset(); return tick(+it.dataset.id, it); }
    return reset();
  }
  if (!drag) return;
  const d = drag; drag = null;
  document.querySelector('.gap')?.remove();
  document.querySelectorAll('.day.drop').forEach(b => b.classList.remove('drop'));
  d.it.classList.remove('lift'); d.it.style.transform = '';
  setTimeout(() => { suppressClick = false; }, 50);
  if (e.type === 'touchcancel') return render();
  if (!d.inCal) {
    if (!d.target) return render();
    const { section, before } = d.target;
    const order = D.dashboard.filter(i => i !== d.src.id);       // show it in place at once
    order.splice(before != null && order.includes(before) ? order.indexOf(before) : order.length, 0, d.src.id);
    D.dashboard = order; d.src.section = section; render();
    return edit({ op: 'task.place', id: d.src.id, section, before });
  }
  const to = d.dayTo || d.day, start = d.timed ? d.newStart || d.start : null;
  if (to === d.day && start === (d.timed ? d.start : null)) return render();
  const end = start ? toHM(toMin(start) + d.len) : null;
  if (to !== d.day) goDay(to);
  if (d.kind === 'task') return edit({ op: 'task.set', id: d.src.id, due: to, ...(start ? { start, end } : {}) });
  if (d.kind === 'event') return edit({ op: 'event.move', id: d.src.id, from: d.day, date: to, start, end });
  return edit({ op: 'class.set', id: d.src.id, title: d.src.title, note: d.src.note, start, end });
}
for (const el of [$('#cal'), $('#tasks')]) { el.addEventListener('touchstart', down, { passive: true }); el.addEventListener('mousedown', down); }
document.addEventListener('touchmove', move, { passive: false });
document.addEventListener('mousemove', move);
document.addEventListener('touchend', up); document.addEventListener('touchcancel', up); document.addEventListener('mouseup', up);
document.addEventListener('contextmenu', e => { if (e.target.closest('.list')) e.preventDefault(); });

/* ================= the keyboard =================
   iOS lays the keyboard over a fixed sheet; the visual viewport says how much of it is covered. */
if (window.visualViewport) {
  const vv = visualViewport, kb = () => document.documentElement.style.setProperty('--kb', Math.max(0, Math.round(innerHeight - vv.height - vv.offsetTop)) + 'px');
  vv.addEventListener('resize', kb); vv.addEventListener('scroll', kb);
}

/* ================= start ================= */
redraw();
sync();
setInterval(() => { if (document.visibilityState === 'visible') sync(); }, 20000);
setInterval(() => { if (!drag && !form) render(); }, 60000);    // the now line, past rows, a new day
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { if (day < todayISO() && !form) day = todayISO(); sync(); } else { watching = null; watchGen++; } });
addEventListener('online', sync);
if (TAILNET && navigator.serviceWorker) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
