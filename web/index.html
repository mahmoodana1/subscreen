<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Subscreen</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* Layout: black glass, the same language as dojo and taskvim. True black, no boxes: a section is a small title over a hairline rule.
   Five pages swipe sideways; Home is the clock plus a glance column that links into every other page. Dark-only on purpose (AMOLED). */
:root{
  --bg:#000;
  --text:#dedede;
  --sub:#969696;
  --muted:#606060;
  --faint:#2c2c2c;
  --hair:#1c1c1c;
  --sel:#141414;
  --green:#a6e3a1; --sand:#f9e2af; --rose:#eba0ac; --warm:#fab387; --blue:#89b4fa; --teal:#94e2d5; --purple:#cba6f7; --brown:#c2956e;
  --accent:var(--teal);
  --f-ui:"Manrope",system-ui,sans-serif;
  --f-num:"Manrope",system-ui,sans-serif;
  --f-ar:"IBM Plex Sans Arabic","Noto Sans Arabic",sans-serif;
  --f-flip:"Barlow Condensed","Arial Narrow",sans-serif;
  color-scheme:dark;
}
:root[data-scene="sunrise"]{--accent:var(--warm)}
:root[data-scene="cloudsea"]{--accent:#f5c2e7}
:root[data-scene="storm"]{--accent:var(--purple)}
:root[data-scene="moonlit"]{--accent:#b4befe}
:root[data-scene="lanterns"]{--accent:var(--sand)}
:root[data-scene="koi"]{--accent:var(--rose)}
:root[data-scene="rain"]{--accent:var(--teal)}
:root[data-scene="tide"]{--accent:#89dceb}
:root[data-scene="orbit"]{--accent:var(--blue)}

[hidden]{display:none!important}
html{height:100%}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--f-ui);-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;appearance:none;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:1px solid var(--accent);outline-offset:3px;border-radius:4px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
body{font-variant-numeric:tabular-nums;letter-spacing:.005em}

#sky{position:fixed;inset:0;width:100%;height:100%;display:block;background:var(--bg);transition:opacity .6s}
#fauna{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none;z-index:1}

.app{position:fixed;inset:0;z-index:2;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 20px calc(env(safe-area-inset-bottom,0px) + 8px);box-sizing:border-box;max-width:1400px;margin:0 auto;transition:filter .8s}
:root[data-night] .app,:root[data-night] #fauna,:root[data-night] #sky{filter:grayscale(1) sepia(1) hue-rotate(-38deg) saturate(3.2) brightness(.72)}

/* ---------- top rail ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:28px;font-size:12px}
.hosts{display:flex;gap:18px;align-items:center;min-width:0}
.host{display:flex;align-items:center;gap:7px;color:var(--muted);transition:color .3s;font-family:var(--f-num);font-size:12px}
.host i{width:6px;height:6px;border-radius:50%;border:1px solid currentColor;box-sizing:border-box;transition:background .3s,border-color .3s}
.host.on{color:var(--text)}
.host.on i{background:var(--accent);border-color:var(--accent);box-shadow:0 0 10px var(--accent)}
.mode{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{display:flex;gap:16px;align-items:center;color:var(--muted);font-family:var(--f-num);font-size:12px;white-space:nowrap}
.mini{color:var(--sub);opacity:0;transition:opacity .4s}
.app:not([data-page="home"]) .mini{opacity:1}
.net{display:flex;align-items:center;gap:6px}
.net i{width:5px;height:5px;border-radius:50%;background:var(--green)}

/* ---------- pager ---------- */
.pager{overflow:hidden;min-height:0;touch-action:pan-y}
.track{display:flex;height:100%;transition:transform .55s cubic-bezier(.22,.9,.24,1)}
.page{flex:0 0 100%;height:100%;overflow:hidden;padding-block:10px;box-sizing:border-box;scrollbar-width:none;position:relative}
.page::-webkit-scrollbar{display:none}
/* every page fits the screen: .fit is scaled down by JS when its content is taller than the page */
.fit{height:100%;transform-origin:top left}
.fit > *{transition:opacity .5s}
.page:not(.on) .fit > *{opacity:0}
.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:clamp(20px,4vw,56px);align-items:start}

/* a section: title + hairline, never a box */
.sec + .sec{margin-top:18px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 0 4px;padding-bottom:6px;border-bottom:1px solid var(--hair);font:500 10.5px var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.src{font:400 10.5px var(--f-num);letter-spacing:0;text-transform:none;color:var(--muted)}
.line{display:block;height:2px;background:var(--faint);border-radius:2px;overflow:hidden}
.line i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .8s cubic-bezier(.22,.9,.24,1)}
.btn{display:inline-flex;align-items:center;gap:8px;font-size:13px;padding:9px 14px;border-radius:999px;background:var(--text);color:#000;font-weight:500;transition:transform .15s}
.btn:active{transform:scale(.96)}
.btn.ghost{background:transparent;color:var(--sub);box-shadow:inset 0 0 0 1px var(--faint)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);flex:none}

/* ---------- home ---------- */
#p-home .fit{display:flex;align-items:center}
.home{display:grid;grid-template-columns:minmax(0,1fr) minmax(150px,.27fr);gap:clamp(18px,3vw,48px);align-items:center;width:100%}
.clockblock{min-width:0;transition:transform 6s ease-in-out;container-type:inline-size;display:grid;justify-content:center}
.stack{display:flex;flex-direction:column;min-width:0}
.stack .when{justify-content:center}
/* flip clock: two cards, each split in half; a minute change folds the top half down */
.flipclock{--ch:min(56vh,46cqw);display:flex;gap:calc(var(--ch)*.05)}
.flip{position:relative;width:calc(var(--ch)*1.04);height:var(--ch);perspective:calc(var(--ch)*3.5);font:600 calc(var(--ch)*1.04)/1 var(--f-flip);color:#e6e6e6;letter-spacing:-.01em;font-variant-numeric:tabular-nums;--r:calc(var(--ch)*.055)}
.flip .h{position:absolute;left:0;right:0;height:50%;overflow:hidden;-webkit-backface-visibility:hidden;backface-visibility:hidden}
/* clear glass: a faint tint and a whisper of blur, so the scene behind stays sharp; a soft shadow keeps the digits readable */
.flip .h{background:rgba(16,16,20,.1);-webkit-backdrop-filter:blur(.01px);backdrop-filter:blur(.01px)}
.flip .h span{text-shadow:0 calc(var(--ch)*.01) calc(var(--ch)*.06) rgba(0,0,0,.35)}
.flip .ft,.flip .fb{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgb(22,22,26)}
.flip .up{top:0;border-radius:var(--r) var(--r) 0 0;background:linear-gradient(rgba(255,255,255,.045),rgba(255,255,255,.02));box-shadow:inset 0 1px 0 rgba(255,255,255,.08),inset 1px 0 0 rgba(255,255,255,.04),inset -1px 0 0 rgba(255,255,255,.04)}
.flip .lo{bottom:0;border-radius:0 0 var(--r) var(--r);background:linear-gradient(rgba(255,255,255,.03),rgba(255,255,255,.015));box-shadow:inset 0 -1px 0 rgba(255,255,255,.04),inset 1px 0 0 rgba(255,255,255,.04),inset -1px 0 0 rgba(255,255,255,.04)}
.flip .h span{position:absolute;left:0;right:0;height:200%;display:flex;align-items:center;justify-content:center;padding-top:calc(var(--ch)*.01);box-sizing:border-box}
.flip .up span{top:0}
.flip .lo span{bottom:0}
.flip .ft{z-index:3;transform-origin:50% 100%;visibility:hidden;will-change:transform}
.flip.go .ft,.flip.go .fb{visibility:visible}
.flip .fb{z-index:3;transform-origin:50% 0;transform:rotateX(90deg);visibility:hidden;will-change:transform}
/* The glass is see-through, so a leaf gets an opaque backing (::before) that hides the digit behind it,
   and a shade (::after) that darkens it as it tips away or lightens it as it lands. The backing fades in
   as the top leaf starts to fall and out as the bottom one settles, while the static halves cross-fade
   their digits, so nothing ever shows two numbers at once. Only transform and opacity animate, so the
   whole flip runs on the compositor and stays smooth while the sky shader keeps the main thread busy. */
.flip .ft::before,.flip .fb::before,.flip .ft::after,.flip .fb::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;will-change:opacity}
.flip .ft::before,.flip .fb::before{background:linear-gradient(rgba(30,30,37,.4),rgba(24,24,30,.4))}
.flip .ft::after{background:#000;z-index:1}
.flip .fb::after{background:#fff;z-index:1}
.flip{--d:0s;--f1:.3s;--f2:.42s}
#fH{--d:.07s}
.flip.go .ft{animation:flipTop var(--f1) var(--d) cubic-bezier(.45,0,.9,.55) both}
.flip.go .ft::before{animation:backIn var(--f1) var(--d) linear both}
.flip.go .ft span{animation:digitFall var(--f1) var(--d) linear both}
.flip.go .ft::after{animation:shadeTop var(--f1) var(--d) cubic-bezier(.45,0,.9,.55) both}
.flip.go .up:not(.ft) span{animation:digitIn var(--f1) var(--d) linear both}
.flip.go .fb{animation:flipBot var(--f2) calc(var(--d) + var(--f1)) cubic-bezier(.12,.62,.28,1) both}
.flip.go .fb::before{animation:backOut var(--f2) calc(var(--d) + var(--f1)) linear both}
.flip.go .fb::after{animation:shadeBot var(--f2) calc(var(--d) + var(--f1)) ease-out both}
.flip.go .lo:not(.fb) span{animation:digitOut var(--f2) calc(var(--d) + var(--f1)) linear both}
.flip::after{content:"";position:absolute;left:0;right:0;top:50%;height:max(2px,calc(var(--ch)*.009));margin-top:calc(max(2px,calc(var(--ch)*.009)) / -2);background:rgba(0,0,0,.75);z-index:5;box-shadow:0 1px 0 rgba(255,255,255,.05)}
.flip::before{content:"";position:absolute;inset:0;border-radius:var(--r);box-shadow:0 calc(var(--ch)*.04) calc(var(--ch)*.12) rgba(0,0,0,.18);pointer-events:none}
@keyframes flipTop{from{transform:rotateX(0)}to{transform:rotateX(-90deg)}}
@keyframes flipBot{from{transform:rotateX(90deg)}to{transform:rotateX(0)}}
@keyframes shadeTop{to{opacity:.45}}
@keyframes shadeBot{from{opacity:.1}to{opacity:0}}
@keyframes digitFall{0%,30%{opacity:1}100%{opacity:0}}
@keyframes backIn{0%{opacity:0}30%,100%{opacity:1}}
@keyframes backOut{0%,40%{opacity:1}85%,100%{opacity:0}}
@keyframes digitIn{0%,55%{opacity:0}100%{opacity:1}}
@keyframes digitOut{0%,10%{opacity:1}30%,100%{opacity:0}}
.when{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:clamp(12px,1.5vw,15px);color:var(--sub)}
.when .hijri{color:var(--sand)}
.minute{margin-top:8px;max-width:100%}
.minute i{width:100%!important;transform-origin:0 50%;transform:scaleX(0);will-change:transform}

/* idle: the header, the dock and the glance fade out, then the clock grows to fill the screen
   (a FLIP transform, so the growth is one smooth compositor animation); a tap brings it all back */
.top,.dock{transition:opacity .45s}
.glance{transition:opacity .6s .2s}
.app.idling .top,.app.idling .dock,.app.idling .glance{opacity:0;pointer-events:none;transition-delay:0s}
.app.idle{grid-template-rows:0 minmax(0,1fr) 0}
.app.idle .top,.app.idle .dock{overflow:hidden;min-height:0;padding:0}
.app.idle .glance{display:none}
.app.idle .home{grid-template-columns:minmax(0,1fr)}
.app.idle .flipclock{--ch:min(66vh,46cqw)}
/* the clock sits high so the cat, lying on the minute line, has room to hang its legs and tail */
.app.idle{padding-top:calc(env(safe-area-inset-top,0px) + 4px)}
.app.idle #p-home{padding-block:0}
.app.idle #p-home .fit{align-items:flex-start}
.app.idle .stack .when{margin-top:14px}
.idlep{display:none;margin-top:12px;text-align:right;font:600 13px var(--f-num);letter-spacing:.03em;color:#fff;white-space:nowrap;text-shadow:0 1px 8px rgba(0,0,0,.7)}
.idlep .in{font-weight:400;color:rgba(255,255,255,.72)}
.app.idle .idlep{display:block;animation:fade .8s .35s both}
/* a soft scrim keeps the small text readable over the brighter ambients */
.glance{display:flex;flex-direction:column;min-width:0;background:radial-gradient(closest-side,rgba(0,0,0,.58),rgba(0,0,0,.46) 50%,rgba(0,0,0,.16) 80%,transparent);margin:-40px -48px;padding:40px 48px}
.g{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;padding:7px 8px;margin:0 -8px;border-bottom:1px solid var(--hair);text-align:left;border-radius:6px;transition:background .2s}
.g:last-child{border-bottom:0}
.g:active,.g:hover{background:var(--sel)}
.g .k{grid-row:1;grid-column:1;font:500 8.5px var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:#8a8a8a}
.g .r{grid-row:1;grid-column:2;font:400 10px var(--f-num);color:var(--sub);white-space:nowrap;text-align:right}
.g .v{grid-row:2;grid-column:1 / 3;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g .bar{grid-row:3;grid-column:1 / 3;margin-top:5px}
.g .bar i{background:var(--sand)}
.g.prayer.iqama .bar i{background:var(--teal)}

/* ---------- display menu ---------- */
.menu-btn{width:30px;height:30px;margin:-4px -6px -4px 0;border-radius:50%;display:grid;place-items:center;color:var(--muted);transition:color .2s,background .2s}
.menu-btn svg{width:16px;height:16px}
.menu-btn[aria-expanded="true"]{color:var(--text);background:var(--sel)}
.menu{position:fixed;top:calc(env(safe-area-inset-top,0px) + 46px);right:16px;z-index:30;width:min(600px,calc(100vw - 32px));max-height:calc(100% - 60px);overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:0 24px;background:rgba(12,12,12,.93);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:inset 0 0 0 1px var(--faint),0 20px 60px rgba(0,0,0,.7);border-radius:16px;padding:14px 16px 6px;box-sizing:border-box;transform-origin:top right;animation:menuIn .25s cubic-bezier(.22,.9,.24,1)}
.menu h3{margin:0 0 10px;font:500 10px var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.swatches{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-bottom:12px}
.sw{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10.5px;color:var(--sub)}
.sw i{width:38px;height:38px;max-width:100%;border-radius:50%;box-shadow:inset 0 0 0 1px var(--faint);transition:box-shadow .2s,transform .2s}
.sw:active i{transform:scale(.92)}
.sw.on{color:var(--text)}
.sw.on i{box-shadow:0 0 0 2px #0c0c0c,0 0 0 3px var(--text)}
.sw[data-scene="sunrise"] i{background:radial-gradient(circle at 70% 62%,#ffe9c0 0 9%,#fab38799 15%,transparent 34%),linear-gradient(180deg,#14091c 10%,#8c3346 50%,#f39a5a 66%,#3a1418 67%,#120509 100%)}
.sw[data-scene="cloudsea"] i{background:radial-gradient(circle at 75% 46%,#fff1d6 0 7%,#ffab7a88 16%,transparent 34%),linear-gradient(180deg,#0d1026 8%,#6b4570 40%,#f6a777 52%,#c98a8c 60%,#5e4a78 100%)}
.sw[data-scene="storm"] i{background:radial-gradient(ellipse 40% 18% at 60% 52%,#9a98e0aa,transparent 70%),linear-gradient(180deg,#0a0c14 8%,#2a2c3c 30%,#1a1c28 50%,#06070c 56%,#0c0e18 70%,#02030a 100%)}
.sw[data-scene="moonlit"] i{background:radial-gradient(circle at 68% 30%,#f4f2e6 0 13%,#aab4d855 22%,transparent 45%),linear-gradient(180deg,#0a1024,#03050c 85%)}
.sw[data-scene="lanterns"] i{background:radial-gradient(circle at 30% 34%,#ffc27a 0 5%,transparent 10%),radial-gradient(circle at 64% 22%,#ffb36a 0 4%,transparent 9%),radial-gradient(circle at 58% 52%,#ffd08f 0 6%,#ff8a3d55 14%,transparent 24%),linear-gradient(180deg,#05061a 10%,#2b0f26 64%,#080611 66%,#1a0c16 100%)}
.sw[data-scene="koi"] i{background:radial-gradient(ellipse 22% 9% at 40% 42%,#f07a4a 60%,transparent 100%),radial-gradient(circle at 72% 70%,#1d4a24 0 16%,transparent 17%),radial-gradient(circle at 50% 50%,#0f3a3c,#02100f)}
.sw[data-scene="rain"] i{background:radial-gradient(circle at 30% 65%,#ff8a3d88 0 10%,transparent 18%),radial-gradient(circle at 65% 72%,#ff474766 0 8%,transparent 16%),radial-gradient(circle at 58% 40%,#5cc8e055 0 9%,transparent 17%),linear-gradient(180deg,#05060c,#1a1018)}
.sw[data-scene="tide"] i{background:linear-gradient(155deg,#0f0d0b 40%,#5fe0ff 46%,#0b4a63 50%,#00121e 70%)}
.sw[data-scene="orbit"] i{background:radial-gradient(circle at 50% 160%,#04070f 58%,#ffd9a0 60%,#4a8cff 62%,#0e1d55 66%,transparent 71%),#000}
.sw[data-scene="off"] i{background:#000}
.rowt{display:flex;justify-content:space-between;align-items:center;width:100%;padding:8px 0;border-top:1px solid var(--hair);font-size:13px;text-align:left}
.switch{width:30px;height:18px;border-radius:9px;background:var(--faint);position:relative;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--sub);transition:transform .2s,background .2s}
[aria-pressed="true"] .switch{background:var(--accent)}
[aria-pressed="true"] .switch::after{transform:translateX(12px);background:#000}
.menu-col{min-width:0}
.rowv{color:var(--sub);font-size:12px}
.menu-btn{position:relative}
.menu-btn.has-update::after{content:"";position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
/* rest: true black (AMOLED pixels off) with a faint clock that wanders so nothing burns in */
.rest{position:fixed;inset:0;z-index:48;background:#000;cursor:pointer;animation:fade 1.4s ease-out}
.rest-clock{position:absolute;font:300 28px var(--f-ui);color:#262626;font-variant-numeric:tabular-nums;transition:left 3s ease-in-out,top 3s ease-in-out;white-space:nowrap}
@keyframes menuIn{from{opacity:0;transform:scale(.94) translateY(-4px)}}

/* ---------- tasks ---------- */
.group{margin-top:8px}
.group-h{display:flex;gap:8px;align-items:baseline;font-size:12px;color:var(--sub);margin-bottom:2px}
.group-h b{font-weight:500;color:var(--text)}
.task{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:12px;align-items:center;padding:6px 0;transition:opacity .4s;width:100%;text-align:left}
.chk{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--muted);position:relative;transition:background .25s,box-shadow .25s}
.chk::after{content:"";position:absolute;left:5px;top:2px;width:4px;height:8px;border:solid #000;border-width:0 1.5px 1.5px 0;transform:rotate(45deg) scale(0);transition:transform .2s}
.task.done .chk{background:var(--green);box-shadow:none}
.task.done .chk::after{transform:rotate(45deg) scale(1)}
.task.done{opacity:.35}
.task.done .t{text-decoration:line-through}
.t{font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t .proj{font-size:12px;margin-right:6px}
.due{font:400 11.5px var(--f-num);color:var(--muted);white-space:nowrap}
.due.late{color:var(--rose)}
.due.today{color:var(--sand)}
.due.habit{color:var(--teal)}
.big{font-weight:300;font-size:clamp(34px,5vw,54px);line-height:1;letter-spacing:-.03em}
.big small{font-size:.42em;color:var(--muted);letter-spacing:0;margin-left:4px}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:4px}
.kv div{min-width:0}
.kv span{display:block;font:500 10px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.kv b{display:block;font:400 17px var(--f-num);margin-top:3px;white-space:nowrap}
.kv small{color:var(--muted);font-size:11px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,9px);grid-auto-columns:9px;gap:3px;margin-top:10px;overflow:hidden}
.heat i{border-radius:2px;background:#151515}
.heat .l1{background:#466048}.heat .l2{background:#648c62}.heat .l3{background:#85b981}.heat .l4{background:#a6e3a1}
.heat .today{box-shadow:0 0 0 1px var(--text)}
.course{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:7px 0;font-size:13px}
.course .line{grid-column:1 / 3}
.course .p{font:400 11.5px var(--f-num);color:var(--sub)}

/* ---------- dojo ---------- */
.belt{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.belt .kanji{font-size:13px;color:var(--muted);letter-spacing:.2em}
.belt-name{font-weight:300;font-size:clamp(34px,5vw,56px);letter-spacing:-.03em;line-height:1}
.xp{display:flex;justify-content:space-between;font:400 12px var(--f-num);color:var(--sub);margin:12px 0 6px}
.review{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 0;font-size:13.5px;border-bottom:1px solid var(--hair)}
.review:last-child{border-bottom:0}
.review .n{font:400 11px var(--f-num);color:var(--muted);min-width:2.6em}
.diff{font:400 11px var(--f-num)}
.diff.Easy{color:var(--teal)}.diff.Medium{color:var(--sand)}.diff.Hard{color:var(--rose)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}

/* ---------- machines ---------- */
.machs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:clamp(20px,4vw,48px)}
.mach{cursor:pointer;min-width:0}
.mach-h{display:flex;align-items:center;gap:9px;padding-bottom:6px;border-bottom:1px solid var(--hair)}
.mach-h b{font:500 13px var(--f-num)}
.mach-h .kind{font-size:12px;color:var(--muted)}
.mach-h .idle{margin-left:auto;font:400 11.5px var(--f-num);color:var(--muted)}
.mach.on .mach-h .dot{background:var(--accent);box-shadow:0 0 8px var(--accent)}
.mach.on .mach-h .idle{color:var(--accent)}
.spark{width:100%;height:38px;display:block;margin:10px 0 8px}
.np{display:grid;grid-template-columns:38px minmax(0,1fr) auto auto;gap:12px;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--hair)}
.cover{width:38px;height:38px;border-radius:6px;background:#151515}
.np .tt{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np .ar{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np .line{margin-top:6px}
.icon{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--sub);transition:background .2s,color .2s}
.icon:active{background:var(--sel);color:var(--text)}
.icon svg{width:18px;height:18px}
.np.empty{color:var(--muted);font-size:13px;grid-template-columns:1fr}
.controls{margin-top:22px}
.keys{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px;margin-top:8px}
.key{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 4px 10px;border-radius:12px;color:var(--sub);font-size:10.5px;transition:background .2s,color .2s;position:relative;overflow:hidden;text-align:center}
.key:hover{background:var(--sel)}
.key svg{width:20px;height:20px}
.key .n{font:300 20px var(--f-ui);line-height:20px;color:var(--text)}
.key.on{color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,transparent)}
.rip{position:absolute;width:16px;height:16px;border-radius:50%;background:var(--text);opacity:.18;transform:translate(-50%,-50%) scale(0);animation:rip .55s ease-out forwards;pointer-events:none}

/* ---------- claude ---------- */
.claude{grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr)}
.crab{width:100%;max-width:220px;aspect-ratio:2.4/1;display:block;image-rendering:pixelated}
.crab-say{font-weight:300;font-size:clamp(24px,3.4vw,36px);letter-spacing:-.02em;line-height:1.1;margin-top:6px}
.crab-say.alert{color:var(--rose)}
.usage{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;font-size:12.5px;color:var(--sub);margin-top:6px}
.usage .line{grid-column:1 / 3;margin-bottom:8px}
.usage .num{color:var(--text);font-size:12px}
.sess{padding:12px 0;border-bottom:1px solid var(--hair)}
.sess:last-child{border-bottom:0}
.sess-h{display:flex;align-items:center;gap:10px;min-width:0}
.sess-h code{font:500 13px var(--f-num);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sess-h .host-tag{font:400 11px var(--f-num);color:var(--muted)}
.sess-h .st{margin-left:auto;font-size:11.5px;color:var(--muted);white-space:nowrap}
.sess.working .dot{background:var(--teal);animation:soft 1.4s infinite}
.sess.working .st{color:var(--teal)}
.sess.waiting .dot{background:var(--rose);animation:ping 1.8s infinite}
.sess.waiting .st{color:var(--rose)}
.sess p{margin:5px 0 0 16px;font-size:13px;color:var(--sub)}
.sess p code{font-family:var(--f-num);color:var(--text);font-size:12.5px}
.sess .actions{margin:10px 0 0 16px}

/* ---------- dock ---------- */
.dock{display:flex;justify-content:center;gap:clamp(14px,4vw,34px);padding-top:8px;font-size:12px}
.dock button{color:var(--muted);padding:6px 2px;position:relative;transition:color .3s}
.dock button::after{content:"";position:absolute;left:50%;bottom:0;width:0;height:1.5px;background:var(--text);border-radius:2px;transform:translateX(-50%);transition:width .35s cubic-bezier(.22,.9,.24,1)}
.dock button.on{color:var(--text)}
.dock button.on::after{width:14px}
.badge{position:absolute;top:4px;right:-8px;width:5px;height:5px;border-radius:50%;background:var(--rose)}

/* ---------- overlays ---------- */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 52px);transform:translate(-50%,10px);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;background:#0d0d0d;box-shadow:inset 0 0 0 1px var(--faint);border-radius:10px;padding:10px 14px;font-size:12.5px;color:var(--sub);max-width:calc(100% - 40px);box-sizing:border-box;z-index:40}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.has-action.show{pointer-events:auto;display:flex;align-items:center;gap:14px}
.toast-btn{color:var(--accent);font-weight:500;font-size:12.5px;padding:2px 0}
.toast b{color:var(--text);font-weight:500}
.toast code{font:12px var(--f-num);color:var(--text);word-break:break-all}
.pop{position:fixed;width:5px;height:5px;margin:-2.5px;border-radius:50%;pointer-events:none;z-index:45;animation:pop .7s cubic-bezier(.2,.8,.3,1) forwards}

.athan{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(0,0,0,.94);cursor:pointer;animation:fade .7s ease-out;overflow:hidden}
.athan .ring{position:absolute;left:50%;top:50%;width:46vmin;height:46vmin;margin:-23vmin 0 0 -23vmin;border-radius:50%;box-shadow:inset 0 0 0 1px var(--sand);opacity:0;animation:ring 5s cubic-bezier(.2,.6,.3,1) infinite}
.athan .ring:nth-child(2){animation-delay:1.66s}
.athan .ring:nth-child(3){animation-delay:3.33s}
.athan-in{position:relative;text-align:center;padding:20px}
.athan-ar{font-family:var(--f-ar);font-weight:200;font-size:min(22vmin,160px);line-height:1.15;color:var(--sand)}
.athan-en{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--sub);margin-top:4px}
.athan-note{font-size:11.5px;color:var(--muted);margin-top:22px}

.empty{color:var(--muted);font-size:13px;margin:10px 0}
.host.off,.mach.off{opacity:.4}
.key:disabled{opacity:.35}
.agents-row{display:flex;gap:8px;padding:2px 0 10px}
.agents-row input{flex:1;min-width:0;background:#000;color:var(--text);border:0;box-shadow:inset 0 0 0 1px var(--faint);border-radius:999px;padding:8px 12px;font:12px var(--f-num)}
.agents-row input:focus{outline:none;box-shadow:inset 0 0 0 1px var(--accent)}
.agents-row .btn{padding:7px 14px;font-size:12px}
.ver{font:10.5px var(--f-num);color:var(--muted);padding:8px 0 4px}
@keyframes soft{50%{opacity:.25}}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--rose) 60%,transparent)}100%{box-shadow:0 0 0 7px transparent}}
@keyframes rip{to{transform:translate(-50%,-50%) scale(12);opacity:0}}
@keyframes pop{to{transform:translate(var(--dx),var(--dy));opacity:0}}
@keyframes ring{0%{transform:scale(.4);opacity:0}15%{opacity:.7}100%{transform:scale(2.6);opacity:0}}
@keyframes fade{from{opacity:0}}

@media (max-aspect-ratio:1/1){
  .mode{display:none}
  .home,.cols,.claude{grid-template-columns:minmax(0,1fr)}
  .home{gap:22px}
  .flipclock{--ch:min(34vh,47cqw)}
  .app.idle .flipclock{--ch:min(52vh,46cqw)}
  .app.idle #p-home .fit{align-items:center}
  .keys{grid-template-columns:repeat(5,minmax(0,1fr))}
}
@media (max-width:520px){
  .kv{grid-template-columns:repeat(2,minmax(0,1fr))}
  .net span{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>

<script>
(() => {
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const root = document.documentElement, app = $('#app');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const store = {
  get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
const pad = n => String(n).padStart(2, '0');
const hm = d => pad(d.getHours()) + ':' + pad(d.getMinutes());
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const css = n => getComputedStyle(root).getPropertyValue(n).trim();
const DAY = 86400000;
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const startOfDay = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };

function fit(c) {
  const r = c.getBoundingClientRect(), d = Math.min(devicePixelRatio || 1, 2);
  const w = Math.max(1, Math.round(r.width * d)), h = Math.max(1, Math.round(r.height * d));
  if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
  return d;
}
let toastTimer;
function toast(html, action) {
  const t = $('#toast'); t.innerHTML = html;
  t.classList.toggle('has-action', !!action);
  if (action) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'toast-btn'; b.textContent = action.label;
    b.addEventListener('click', () => { t.classList.remove('show'); action.run(); });
    t.appendChild(b);
  }
  t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), action ? 5000 : 2600);
}
function pop(el, color, n = 12) {
  if (reduce || !el) return;
  const r = el.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
  for (let i = 0; i < n; i++) {
    const s = document.createElement('i'); s.className = 'pop';
    const a = i / n * Math.PI * 2 + rand(-.2, .2), d = rand(18, 40);
    s.style.cssText = `left:${x}px;top:${y}px;background:${color};--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d}px`;
    document.body.appendChild(s); setTimeout(() => s.remove(), 750);
  }
}

/* ================= ambient sky (GPU) ================= */
const VERT = 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
const COMMON = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform vec2 u_res;uniform float u_t,u_dim;uniform vec4 u_fx;
float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1.,0.)),u.x),mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),u.x),u.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*noise(p);p=p*2.03+vec2(1.7,9.2);a*=.5;}return v;}
vec3 post(vec3 col,vec2 uv){
  col*=mix(.75,.16,u_dim);
  col*=smoothstep(1.35,.35,length((uv-.5)*vec2(1.1,1.3)));
  return col;
}
`;
const SCENES = {
  // Desert dawn: layered dunes with lit and shadowed faces under a low sun.
  // Desert dawn: dune ranges fading into warm haze under a low sun. The far ridge is dune()
  // with DUNE_FAR, mirrored in JS so the caravan walks on it.

function drawSparks() {
  const act = activeAgent();

    const c = $(`.mach[data-i="${i}"] .spark`);

    const d = fit(c), x = c.getContext('2d'), W = c.width, H = c.height;
    x.clearRect(0, 0, W, H);
    const col = a === act ? css('--accent') : '#606060';
    const pts = a.hist.map((v, k) => [k / 59 * (W - 6 * d), H - 3 * d - v / 100 * (H - 6 * d)]);
    x.beginPath(); pts.forEach(([px, py], k) => k ? x.lineTo(px, py) : x.moveTo(px, py));
    x.lineTo(pts.at(-1)[0], H); x.lineTo(0, H); x.closePath();
    const gr = x.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, col); gr.addColorStop(1, 'transparent');
    x.globalAlpha = .14; x.fillStyle = gr; x.fill(); x.globalAlpha = 1;
    x.beginPath(); pts.forEach(([px, py], k) => k ? x.lineTo(px, py) : x.moveTo(px, py));
    x.strokeStyle = col; x.lineWidth = 1.2 * d; x.lineJoin = 'round'; x.stroke();

  });
}

// In the app the athan plays natively (louder, and with no tap needed after a
// restart). In a plain browser it falls back to Web Audio.
let actx = null, athanBuf = null, athanSrc = null, athanData = null;
async function startAthanSound() {
  actx = actx || new (window.AudioContext || window.webkitAudioContext)();
  const resumed = actx.resume();
  athanData = athanData || fetch('athan.mp3').then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); });
  if (!athanBuf) athanBuf = await actx.decodeAudioData((await athanData).slice(0));
  await resumed;
  stopAthanSound();
  const now = actx.currentTime;
  const src = actx.createBufferSource(); src.buffer = athanBuf;
  const boost = actx.createGain(); boost.gain.value = 4;
  const limit = actx.createDynamicsCompressor();
  limit.threshold.value = -1; limit.knee.value = 0; limit.ratio.value = 20; limit.attack.value = .002; limit.release.value = .2;
  const fade = actx.createGain(); fade.gain.setValueAtTime(0, now); fade.gain.linearRampToValueAtTime(1, now + 7);
  src.connect(boost); boost.connect(limit); limit.connect(fade); fade.connect(actx.destination);
  src.onended = () => { if (athanSrc === src) closeAthan(); };
  src.start(); athanSrc = src;
}
function stopAthanSound() { if (!athanSrc) return; const s = athanSrc; athanSrc = null; s.onended = null; try { s.stop(); } catch {} }

}

}

/* ================= rest: the phone goes dark when nobody is around ================= */
// "Away" means no computer has been touched for N minutes (or none answers).
// Resting is true black with the brightness at its minimum; the page keeps
// running, so it wakes itself when you touch a computer, for the athan, or on a tap.
const restCfg = loadJSON('ss-rest', { auto: true, minutes: 10 });
const REST_STEPS = [5, 10, 20, 30, 60];
let resting = false, sawAway = false, wokeAt = Date.now();
function nearestIdle() {
  const live = agents.filter(a => a.ok && a.state);
  return live.length ? Math.min(...live.map(a => a.state.idle)) : Infinity;
}
function setRest(on) {
  if (on === resting) return;
  resting = on;
  $('#rest').hidden = !on;
  if (native) { try { native.setRest(on); } catch {} }
  if (on) { setMenu(false); sawAway = nearestIdle() > 60; moveRestClock(); }
  else wokeAt = Date.now();
}
function moveRestClock() {
  const c = $('#restClock');
  c.textContent = hm(new Date());
  c.style.left = Math.round(rand(.08, .78) * innerWidth) + 'px';
  c.style.top = Math.round(rand(.1, .8) * innerHeight) + 'px';
}
function checkAway() {
  const idle = nearestIdle();
  if (resting) {
    if (idle > 60) sawAway = true;
    if (sawAway && idle < 20) setRest(false);          // you are back at a computer
    else if (new Date().getSeconds() === 0) moveRestClock();
    return;
  }
  const after = restCfg.minutes * 60;
  if (restCfg.auto && idle > after && Date.now() - wokeAt > after * 1000) setRest(true);
}
function renderRestMenu() {
  $('#restAutoBtn').setAttribute('aria-pressed', String(restCfg.auto));
  $('#restAfterTxt').textContent = `${restCfg.minutes} min`;
}
$('#restAutoBtn').addEventListener('click', () => { restCfg.auto = !restCfg.auto; saveJSON('ss-rest', restCfg); renderRestMenu(); });
$('#restAfterBtn').addEventListener('click', () => {
  restCfg.minutes = REST_STEPS[(REST_STEPS.indexOf(restCfg.minutes) + 1) % REST_STEPS.length];
  saveJSON('ss-rest', restCfg); renderRestMenu();
});
$('#restNowBtn').addEventListener('click', () => setRest(true));
$('#rest').addEventListener('click', () => setRest(false));

// After a short while untouched on Home (longer elsewhere, then it goes Home) everything but the
// clock fades and the clock grows to fill the screen, with the next prayer in small white type
// under it. The first tap anywhere brings the full panel back.
const IDLE_HOME = 20e3, IDLE_AWAY = 120e3;
let idleUI = false, lastTouch = Date.now(), idleStep = 0;
function flipLayout(change) {
  const el = $('#drift .stack'), a = el.getBoundingClientRect();
  el.style.transition = 'none'; el.style.transform = '';
  change(); fitPages();
  const b = el.getBoundingClientRect();
  if (!a.width || !b.width || reduce) return;
  el.style.transformOrigin = '0 0';
  el.style.transform = `translate(${a.left - b.left}px,${a.top - b.top}px) scale(${a.width / b.width})`;
  void el.offsetWidth;
  el.style.transition = 'transform .95s cubic-bezier(.3,.7,.2,1)';
  el.style.transform = '';
}
function setIdle(on) {
  if (on === idleUI) return;
  idleUI = on; clearTimeout(idleStep);
  if (on) {
    app.classList.add('idling');
    idleStep = setTimeout(() => flipLayout(() => app.classList.add('idle')), 450);
  } else {

      document.documentElement.requestFullscreen({ navigationUI: 'hide' }).catch(() => {});
  }, true);
  let wake = null;

const track = $('#track'), pager = $('#pager');
function go(i, instant) {
  pageIndex = clamp(i, 0, PAGES.length - 1);
  if (instant) track.style.transition = 'none';
  track.style.transform = `translateX(${-pageIndex * 100}%)`;
  if (instant) requestAnimationFrame(() => { track.style.transition = ''; });
  app.dataset.page = PAGES[pageIndex];
  $$('.page').forEach((p, k) => p.classList.toggle('on', k === pageIndex));
  $$('#dock button').forEach((b, k) => { b.classList.toggle('on', k === pageIndex); b.setAttribute('aria-current', k === pageIndex ? 'page' : 'false'); });
  try { history.replaceState(null, '', '#' + PAGES[pageIndex]); } catch {}
  if (PAGES[pageIndex] === 'machines') requestAnimationFrame(drawSparks);
}
document.addEventListener('click', e => {

  if (b.dataset.go === 'athan') return openAthan();
  go(+b.dataset.go);
});
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') go(pageIndex + 1);
  if (e.key === 'ArrowLeft') go(pageIndex - 1);
  if (e.key === 'Escape') closeAthan();
});
let drag = null, swallow = false;
pager.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  drag = { x: e.clientX, y: e.clientY, dx: 0, lock: null, id: e.pointerId };
});
pager.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.lock && Math.hypot(dx, dy) > 9) {
    drag.lock = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
    if (drag.lock === 'x') { track.style.transition = 'none'; try { pager.setPointerCapture(e.pointerId); } catch {} }
  }
  if (drag.lock === 'x') {
    const edge = (pageIndex === 0 && dx > 0) || (pageIndex === PAGES.length - 1 && dx < 0);
    drag.dx = edge ? dx * .3 : dx;
    track.style.transform = `translateX(calc(${-pageIndex * 100}% + ${drag.dx}px))`;
  }
});
function endDrag() {
  if (!drag) return;
  if (drag.lock === 'x') {
    track.style.transition = '';
    swallow = true; setTimeout(() => { swallow = false; }, 60);
    go(drag.dx < -60 ? pageIndex + 1 : drag.dx > 60 ? pageIndex - 1 : pageIndex);
  }
  drag = null;
}
pager.addEventListener('pointerup', endDrag);
pager.addEventListener('pointercancel', endDrag);
pager.addEventListener('click', e => { if (swallow) { e.stopPropagation(); e.preventDefault(); } }, true);

const CRAB = ['.XX.........XX.', 'X..X.......X..X', '.XX.........XX.', '...XXXXXXXXX...', '..XXEXXXXXEXX..', '..XXXXXXXXXXX..', '...XXXXXXXXX...'];
const LEGS = ['..X.X.X.X.X.X..', '.X.X.X.....X.X.'];
function drawCrab(t) {
  const c = $('#crab'); if (!c.getBoundingClientRect().width) return;
  fit(c);
  const x = c.getContext('2d'), W = c.width, H = c.height;
  x.clearRect(0, 0, W, H);
  const ps = Math.max(2, Math.floor(Math.min(W / 34, H / 11)));
  const waiting = allSessions().some(s => s.state === 'waiting');
  const walk = reduce ? 0 : Math.sin(t * .6) * (W / 2 - 9 * ps) * .8;
  const ox = Math.round(W / 2 - 7.5 * ps + walk), oy = Math.round(H - 9 * ps);
  const step = reduce ? 0 : Math.floor(t * 7) % 2;
  const snap = waiting && !reduce ? (Math.floor(t * 5) % 2 ? -ps : 0) : 0;
  const body = '#fab387';
  CRAB.forEach((row, ry) => {
    for (let cx = 0; cx < row.length; cx++) {
      const ch = row[cx]; if (ch === '.') continue;
      x.fillStyle = ch === 'E' ? '#000' : body;
      x.fillRect(ox + cx * ps, oy + ry * ps + (ry < 3 ? snap : 0), ps, ps);
    }
  });
  x.fillStyle = body;
  const legs = LEGS[step];
  for (let cx = 0; cx < legs.length; cx++) if (legs[cx] === 'X') x.fillRect(ox + cx * ps, oy + 7 * ps, ps, ps);
  x.fillStyle = '#1c1c1c'; x.fillRect(0, H - Math.max(1, ps / 3), W, Math.max(1, ps / 3));
}

/* ================= fit: no page ever scrolls ================= */
function fitPages() {
  $$('.page').forEach(p => {
    const f = p.querySelector('.fit'); if (!f) return;
    f.style.transform = ''; f.style.width = ''; f.style.height = '';
    const cs = getComputedStyle(p);
    const avail = p.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    const need = f.scrollHeight;
    if (avail > 0 && need > avail + 1) {
      const k = avail / need;
      f.style.transform = `scale(${k})`; f.style.width = (100 / k) + '%'; f.style.height = need + 'px';
    }
  });
}

const fauna = (() => {

    cat.x = clamp(cat.x, lo, hi);
    if (sleeping && cat.state !== 'walk') cat.state = 'sleep';
    else if (!sleeping && cat.state === 'sleep') { cat.state = 'sit'; cat.until = t + 8; }

      while (Math.abs(tx - cat.x) < g.fs * .7 && tries++ < 12) tx = offColon(rand(lo, hi));
      cat.tx = tx; cat.dir = Math.sign(tx - cat.x) || 1; cat.state = 'walk';
