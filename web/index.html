<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Subscreen</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* Layout: black glass, the same language as dojo and taskvim. True black, no boxes: a section is a small title over a hairline rule.
   Five pages swipe sideways; Home is the clock plus a glance column that links into every other page. Dark-only on purpose (AMOLED). */
:root{
  --bg:#000;
  --text:#dedede;
  --sub:#969696;
  --muted:#606060;
  --faint:#2c2c2c;
  --hair:#1c1c1c;
  --sel:#141414;
  --green:#a6e3a1; --sand:#f9e2af; --rose:#eba0ac; --warm:#fab387; --blue:#89b4fa; --teal:#94e2d5; --purple:#cba6f7; --brown:#c2956e;
  --accent:var(--teal);
  --f-ui:"Manrope",system-ui,sans-serif;
  --f-num:"Manrope",system-ui,sans-serif;
  --f-ar:"IBM Plex Sans Arabic","Noto Sans Arabic",sans-serif;
  --f-flip:"Barlow Condensed","Arial Narrow",sans-serif;
  color-scheme:dark;
}
:root[data-scene="sunrise"]{--accent:var(--warm)}
:root[data-scene="cloudsea"]{--accent:#f5c2e7}
:root[data-scene="storm"]{--accent:var(--purple)}
:root[data-scene="moonlit"]{--accent:#b4befe}
:root[data-scene="lanterns"]{--accent:var(--sand)}
:root[data-scene="koi"]{--accent:var(--rose)}
:root[data-scene="rain"]{--accent:var(--teal)}
:root[data-scene="lumiere"]{--accent:#e5c07b}
:root[data-scene="orbit"]{--accent:var(--blue)}

[hidden]{display:none!important}
html{height:100%}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--f-ui);-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;appearance:none;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:1px solid var(--accent);outline-offset:3px;border-radius:4px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
body{font-variant-numeric:tabular-nums;letter-spacing:.005em}

#sky{position:fixed;inset:0;width:100%;height:100%;display:block;background:var(--bg);transition:opacity .6s}
#fauna{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none;z-index:1}
#media{position:fixed;inset:0;background:#000;opacity:0;transition:opacity .6s;pointer-events:none}
#media.on{opacity:1}
#media video,#media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#media::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 75% 70% at 50% 50%,transparent 45%,#000a 100%)}
#catLayer{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none;z-index:3}

.app{position:fixed;inset:0;z-index:2;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 20px calc(env(safe-area-inset-bottom,0px) + 8px);box-sizing:border-box;max-width:1400px;margin:0 auto;transition:filter .8s}
:root[data-night] .app,:root[data-night] #fauna,:root[data-night] #sky,:root[data-night] #media{filter:grayscale(1) sepia(1) hue-rotate(-38deg) saturate(3.2) brightness(.72)}

/* ---------- top rail ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:28px;font-size:12px}
.hosts{display:flex;gap:18px;align-items:center;min-width:0;transition:opacity .4s}
/* Home keeps the top rail quiet: the computers and the network name show on the other pages */
.app[data-page="home"] .hosts,.app[data-page="home"] #netTxt{opacity:0;pointer-events:none}
#netTxt{transition:opacity .4s}
.host{display:flex;align-items:center;gap:7px;color:var(--muted);transition:color .3s;font-family:var(--f-num);font-size:12px}
.host i{width:6px;height:6px;border-radius:50%;border:1px solid currentColor;box-sizing:border-box;transition:background .3s,border-color .3s}
.host.on{color:var(--text)}
.host.on i{background:var(--accent);border-color:var(--accent);box-shadow:0 0 10px var(--accent)}
.mode{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{display:flex;gap:16px;align-items:center;color:var(--muted);font-family:var(--f-num);font-size:12px;white-space:nowrap}
.mini{color:var(--sub);opacity:0;transition:opacity .4s}
.app:not([data-page="home"]) .mini{opacity:1}
.net{display:flex;align-items:center;gap:6px}
.net i{width:5px;height:5px;border-radius:50%;background:var(--green)}

/* ---------- pager ---------- */
.pager{overflow:hidden;min-height:0;touch-action:pan-y}
.track{display:flex;height:100%;transition:transform .55s cubic-bezier(.22,.9,.24,1)}
.page{flex:0 0 100%;height:100%;overflow:hidden;padding-block:10px;box-sizing:border-box;scrollbar-width:none;position:relative}
.page::-webkit-scrollbar{display:none}
/* every page fits the screen: .fit is scaled down by JS when its content is taller than the page */
.fit{height:100%;transform-origin:top left}
.fit > *{transition:opacity .5s}
.page:not(.on) .fit > *{opacity:0}
.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:clamp(20px,4vw,56px);align-items:start}

/* a section: title + hairline, never a box */
.sec + .sec{margin-top:18px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 0 4px;padding-bottom:6px;border-bottom:1px solid var(--hair);font:500 10.5px var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.src{font:400 10.5px var(--f-num);letter-spacing:0;text-transform:none;color:var(--muted)}
.line{display:block;height:2px;background:var(--faint);border-radius:2px;overflow:hidden}
.line i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .8s cubic-bezier(.22,.9,.24,1)}
.btn{display:inline-flex;align-items:center;gap:8px;font-size:13px;padding:9px 14px;border-radius:999px;background:var(--text);color:#000;font-weight:500;transition:transform .15s}
.btn:active{transform:scale(.96)}
.btn.ghost{background:transparent;color:var(--sub);box-shadow:inset 0 0 0 1px var(--faint)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);flex:none}

/* ---------- home ---------- */
#p-home .fit{display:flex;align-items:center}
.home{display:grid;grid-template-columns:minmax(0,1fr) minmax(150px,.27fr);gap:clamp(18px,3vw,48px);align-items:center;width:100%}
.clockblock{min-width:0;transition:transform 6s ease-in-out;container-type:inline-size;display:grid;justify-content:center}
.stack{display:flex;flex-direction:column;min-width:0}
/* the clock: light, slightly see-through digits floating on the scene with no card behind them, so the
   ambient shows everywhere but the strokes; a wide faint shadow keeps them readable over bright skies.
   A changed digit rolls: the old one rises and fades while the new one comes up from below, right-hand
   digit first like an odometer. Only transform and opacity animate, so it runs on the compositor. */
.flipclock{--ch:min(56vh,42cqw);display:flex;align-items:center;justify-content:center;font:300 calc(var(--ch)*1.2)/.84 var(--f-flip);color:rgba(255,255,255,.88);letter-spacing:.005em;font-variant-numeric:tabular-nums;text-shadow:0 0 calc(var(--ch)*.16) rgba(0,0,0,.22),0 calc(var(--ch)*.008) calc(var(--ch)*.03) rgba(0,0,0,.2)}
.roll{display:flex}
/* the separator: one small, faint dot between the hours and the minutes */
.sep{flex:none;width:calc(var(--ch)*.035);height:calc(var(--ch)*.035);margin:0 calc(var(--ch)*.09);border-radius:50%;background:currentColor;opacity:.22}
.dg{position:relative;display:block}
.dg i{display:block;font-style:normal;will-change:transform,opacity}
.dg i + i{position:absolute;left:0;top:0;opacity:0}
.dg.go i:first-child{animation:rollOut .34s var(--d,0s) cubic-bezier(.5,0,.8,.4) both}
.dg.go i + i{animation:rollIn .6s calc(var(--d,0s) + .16s) cubic-bezier(.16,.8,.3,1) both}
@keyframes rollOut{to{transform:translateY(-.22em);opacity:0}}
@keyframes rollIn{from{transform:translateY(.26em);opacity:0}to{transform:none;opacity:1}}
/* one quiet line under the clock: the date, then the next prayer and its countdown, thin and white
   so it reads without pulling the eye off the scene */
.when{display:flex;justify-content:center;align-items:baseline;gap:.6em;margin-top:10px;font:300 clamp(14px,1.8vw,20px)/1.1 var(--f-flip);letter-spacing:.08em;text-transform:uppercase;color:#fff;white-space:nowrap;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.when .wp{display:flex;align-items:baseline;gap:.45em;min-width:0}
.when .wp:not(:empty)::before{content:"·";opacity:.6}
.when .wp b{font-weight:300}
.when .cd{font-variant-numeric:tabular-nums}

/* idle: the header, the dock and the glance fade out, then the clock grows to fill the screen
   (a FLIP transform, so the growth is one smooth compositor animation); a tap brings it all back */
.top,.dock{transition:opacity .45s}
.glance{transition:opacity .6s .2s}
.app.idling .top,.app.idling .dock,.app.idling .glance{opacity:0;pointer-events:none;transition-delay:0s}
.app.idle{grid-template-rows:0 minmax(0,1fr) 0}
.app.idle .top,.app.idle .dock{overflow:hidden;min-height:0;padding:0}
.app.idle .glance{display:none}
.app.idle .home{grid-template-columns:minmax(0,1fr)}
.app.idle .flipclock{--ch:min(66vh,44cqw)}
.app.idle{padding-top:calc(env(safe-area-inset-top,0px) + 4px)}
.app.idle #p-home{padding-block:0 22vh}   /* centred, then lifted well above the middle */
.app.idle #p-home .fit{align-items:center}
.app.idle .stack .when{margin-top:14px}
/* the cat's shelf: it lies on this hairline at the top of the side panel, legs and tail hanging into the gap */
.perch{height:64px;margin:0 -8px;border-top:1px solid rgba(255,255,255,.12);flex:none}
.app.idle .perch{display:none}
/* a soft scrim keeps the small text readable over the brighter ambients */
.glance{display:flex;flex-direction:column;min-width:0;background:radial-gradient(closest-side,rgba(0,0,0,.58),rgba(0,0,0,.46) 50%,rgba(0,0,0,.16) 80%,transparent);margin:-40px -48px;padding:40px 48px}
.g{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;padding:7px 8px;margin:0 -8px;border-bottom:1px solid var(--hair);text-align:left;border-radius:6px;transition:background .2s}
.g:last-child,.g:not(:has(~ .g:not([hidden]))){border-bottom:0}
.g:active,.g:hover{background:var(--sel)}
.g .k{grid-row:1;grid-column:1;font:500 8.5px var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:#8a8a8a}
.g .r{grid-row:1;grid-column:2;font:400 10px var(--f-num);color:var(--sub);white-space:nowrap;text-align:right}
.g .v{grid-row:2;grid-column:1 / 3;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g .bar{grid-row:3;grid-column:1 / 3;margin-top:5px}
.g .bar i{background:var(--sand)}
.g.prayer.iqama .bar i{background:var(--teal)}
/* the prayer leads the panel; a task can take two lines rather than being cut off */
.g.prayer .v{font-size:15px}
.g .r .due{font-size:inherit}
#gTask .v{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.3}

/* ---------- display menu ---------- */
.menu-btn{width:30px;height:30px;margin:-4px -6px -4px 0;border-radius:50%;display:grid;place-items:center;color:var(--muted);transition:color .2s,background .2s}
.menu-btn svg{width:16px;height:16px}
.menu-btn[aria-expanded="true"]{color:var(--text);background:var(--sel)}
.menu{position:fixed;top:calc(env(safe-area-inset-top,0px) + 46px);right:16px;z-index:30;width:min(600px,calc(100vw - 32px));max-height:calc(100% - 60px);overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:0 24px;background:rgba(12,12,12,.93);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:inset 0 0 0 1px var(--faint),0 20px 60px rgba(0,0,0,.7);border-radius:16px;padding:14px 16px 6px;box-sizing:border-box;transform-origin:top right;animation:menuIn .25s cubic-bezier(.22,.9,.24,1)}
.menu h3{margin:0 0 10px;font:500 10px var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.swatches{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-bottom:12px}
.sw{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10.5px;color:var(--sub)}
.sw i{width:38px;height:38px;max-width:100%;border-radius:50%;box-shadow:inset 0 0 0 1px var(--faint);transition:box-shadow .2s,transform .2s}
.sw:active i{transform:scale(.92)}
.sw.on{color:var(--text)}
.sw.on i{box-shadow:0 0 0 2px #0c0c0c,0 0 0 3px var(--text)}
.sw[data-scene="sunrise"] i{background:radial-gradient(circle at 70% 62%,#ffe9c0 0 9%,#fab38799 15%,transparent 34%),linear-gradient(180deg,#14091c 10%,#8c3346 50%,#f39a5a 66%,#3a1418 67%,#120509 100%)}
.sw[data-scene="cloudsea"] i{background:radial-gradient(circle at 75% 46%,#fff1d6 0 7%,#ffab7a88 16%,transparent 34%),linear-gradient(180deg,#0d1026 8%,#6b4570 40%,#f6a777 52%,#c98a8c 60%,#5e4a78 100%)}
.sw[data-scene="storm"] i{background:radial-gradient(ellipse 40% 18% at 60% 52%,#9a98e0aa,transparent 70%),linear-gradient(180deg,#0a0c14 8%,#2a2c3c 30%,#1a1c28 50%,#06070c 56%,#0c0e18 70%,#02030a 100%)}
.sw[data-scene="moonlit"] i{background:radial-gradient(circle at 68% 30%,#f4f2e6 0 13%,#aab4d855 22%,transparent 45%),linear-gradient(180deg,#0a1024,#03050c 85%)}
.sw[data-scene="lanterns"] i{background:radial-gradient(circle at 30% 34%,#ffc27a 0 5%,transparent 10%),radial-gradient(circle at 64% 22%,#ffb36a 0 4%,transparent 9%),radial-gradient(circle at 58% 52%,#ffd08f 0 6%,#ff8a3d55 14%,transparent 24%),linear-gradient(180deg,#05061a 10%,#2b0f26 64%,#080611 66%,#1a0c16 100%)}
.sw[data-scene="koi"] i{background:radial-gradient(ellipse 22% 9% at 40% 42%,#f07a4a 60%,transparent 100%),radial-gradient(circle at 72% 70%,#1d4a24 0 16%,transparent 17%),radial-gradient(circle at 50% 50%,#0f3a3c,#02100f)}
.sw[data-scene="rain"] i{background:repeating-linear-gradient(105deg,transparent 0 7px,#9fb4d040 7px 8px),radial-gradient(circle at 30% 65%,#ffc07a77 0 10%,transparent 18%),radial-gradient(circle at 65% 72%,#8fb4ff66 0 8%,transparent 16%),radial-gradient(circle at 58% 40%,#5cc8e055 0 9%,transparent 17%),linear-gradient(180deg,#05070c,#101722)}
.sw[data-scene="lumiere"] i{background:radial-gradient(circle at 30% 30%,#fff8 0 3%,transparent 4%),radial-gradient(circle at 70% 55%,#fff6 0 2%,transparent 3%),linear-gradient(90deg,transparent 60%,#0b0a10 60% 66%,transparent 66%),linear-gradient(180deg,#07080f,#20202f 55%,#6a4a36 78%,#5d6070 80%)}
.sw[data-scene="orbit"] i{background:radial-gradient(circle at 50% 160%,#04070f 58%,#ffd9a0 60%,#4a8cff 62%,#0e1d55 66%,transparent 71%),#000}
.sw[data-scene="off"] i{background:#000}
.rowt{display:flex;justify-content:space-between;align-items:center;width:100%;padding:8px 0;border-top:1px solid var(--hair);font-size:13px;text-align:left}
.switch{width:30px;height:18px;border-radius:9px;background:var(--faint);position:relative;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--sub);transition:transform .2s,background .2s}
[aria-pressed="true"] .switch{background:var(--accent)}
[aria-pressed="true"] .switch::after{transform:translateX(12px);background:#000}
.menu-col{min-width:0}
.rowv{color:var(--sub);font-size:12px}
.menu-btn{position:relative}
.menu-btn.has-update::after{content:"";position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
/* rest: true black (AMOLED pixels off) with a faint clock that wanders so nothing burns in */
.rest{position:fixed;inset:0;z-index:48;background:#000;cursor:pointer;animation:fade 1.4s ease-out}
.rest-clock{position:absolute;font:300 28px var(--f-ui);color:#262626;font-variant-numeric:tabular-nums;transition:left 3s ease-in-out,top 3s ease-in-out;white-space:nowrap}
@keyframes menuIn{from{opacity:0;transform:scale(.94) translateY(-4px)}}

/* ---------- tasks ---------- */
.group{margin-top:8px}
.group-h{display:flex;gap:8px;align-items:baseline;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:14px 0 2px}
.group:first-child .group-h{margin-top:4px}
.group-h b{font-weight:500;color:var(--sub)}
/* a task row is a big, easy target on the phone: the whole row toggles it */
.task{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:16px;align-items:center;min-height:58px;padding:9px 0;border-bottom:1px solid var(--hair);transition:opacity .4s,background .2s;width:100%;text-align:left;box-sizing:border-box}
.task:last-child{border-bottom:0}
.task:active{background:var(--sel)}
.chk{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--muted);position:relative;transition:background .25s,box-shadow .25s}
.chk::after{content:"";position:absolute;left:5px;top:2px;width:4px;height:8px;border:solid #000;border-width:0 1.5px 1.5px 0;transform:rotate(45deg) scale(0);transition:transform .2s}
.task .chk,.ev .chk{width:24px;height:24px;box-shadow:inset 0 0 0 2px var(--sub)}
.task .chk::after,.ev .chk::after{left:8px;top:3px;width:6px;height:12px;border-width:0 2px 2px 0}
.task.done .chk,.ev.done .chk{background:var(--green);box-shadow:none}
.task.done .chk::after,.ev.done .chk::after{transform:rotate(45deg) scale(1)}
.task.done,.ev.done{opacity:.35}
.task.done .t,.ev.done .t{text-decoration:line-through}
.t{font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task .tx{min-width:0}
.task .t{display:block;font-size:18px;line-height:1.3;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.task .proj{display:block;font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task .due{font-size:14px}
.due{font:400 11.5px var(--f-num);color:var(--muted);white-space:nowrap}
.due.late{color:var(--rose)}
.due.today{color:var(--sand)}
.due.habit{color:var(--teal)}
.big{font-weight:300;font-size:clamp(34px,5vw,54px);line-height:1;letter-spacing:-.03em}
.big small{font-size:.42em;color:var(--muted);letter-spacing:0;margin-left:4px}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:4px}
.kv div{min-width:0}
.kv span{display:block;font:500 10px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.kv b{display:block;font:400 17px var(--f-num);margin-top:3px;white-space:nowrap}
.kv small{color:var(--muted);font-size:11px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,9px);grid-auto-columns:9px;gap:3px;margin-top:10px;overflow:hidden}
.heat i{border-radius:2px;background:#151515}
.heat .l1{background:#466048}.heat .l2{background:#648c62}.heat .l3{background:#85b981}.heat .l4{background:#a6e3a1}
.heat .today{box-shadow:0 0 0 1px var(--text)}
.course{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:10px 0 9px;font-size:16px}
.course .line{grid-column:1 / 3;height:3px}
.course .p{font:400 14px var(--f-num);color:var(--sub)}

/* ---------- calendar ----------
   taskvim's calendar: the chosen day's agenda on the left, the month on the right. Classes, events and
   tasks with a date, all from the computers' /plan/data (the same document the iPhone's Plan draws) */
.calcols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:clamp(20px,4vw,56px);align-items:start}
.ev{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:16px;align-items:center;min-height:58px;padding:9px 0;border-bottom:1px solid var(--hair);width:100%;text-align:left;box-sizing:border-box;transition:opacity .4s,background .2s}
.ev:last-child{border-bottom:0}
.ev.is-task:active{background:var(--sel)}
.ev .at{display:flex;flex-direction:column;font-family:var(--f-num);font-variant-numeric:tabular-nums;line-height:1.2}
.ev .at b{font-weight:500;font-size:17px}
.ev .at span{font-size:13px;color:var(--muted)}
.ev .body{min-width:0;text-align:start}
.ev .t{display:block;font-size:18px;line-height:1.3;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ev .n{font-size:13px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.untimed{grid-template-columns:minmax(0,1fr) auto}
.ev.past .at,.ev.past .t{color:var(--muted)}
.ev .due{font-size:14px}
.nowline{height:0;border-top:1px solid var(--accent);margin:-1px 0 0;position:relative}
.nowline::before{content:"";position:absolute;left:-3px;top:-4px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.cal-sub{margin:16px 0 2px;font:500 10.5px var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.month-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 4px;padding-bottom:6px;border-bottom:1px solid var(--hair)}
.month-h .mt{font:500 15px var(--f-ui);letter-spacing:.02em;padding:6px 10px}
.month-h .icon{width:40px;height:40px;margin:-8px -10px}
.month{display:flex;flex-direction:column;min-height:0}
.mgrid{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));align-content:start;gap:2px 0;text-align:center}
.mgrid .wd{font:500 10px var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:6px 0 4px}
.md{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:0;overflow:hidden;border-radius:10px;font:400 15px var(--f-num);color:var(--text);transition:background .2s}
.md.out{color:var(--faint)}
.md.today{color:var(--accent);font-weight:600}
.md.on{background:var(--sel);box-shadow:inset 0 0 0 1px var(--faint)}
.md .dots{display:flex;gap:3px;height:4px}
.md .dots i{width:4px;height:4px;border-radius:50%;background:var(--sub)}
.md.out .dots i{background:var(--faint)}
/* a page of panes stays put: its lists scroll inside their own boxes, headers and the month stay in place */
.panes .cols,.panes .calcols{height:100%;align-items:stretch}
.pane{display:flex;flex-direction:column;min-height:0}
.panes .sec + .sec{margin-top:18px}
.pane > .sec-h,.pane > .sec:not(.pane){flex:none}
.pane > .pane{flex:1 1 auto}
.scroller{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(#000 calc(100% - 22px),transparent);mask-image:linear-gradient(#000 calc(100% - 22px),transparent);padding-bottom:18px}
.scroller::-webkit-scrollbar{display:none}

/* ---------- machines ---------- */
.machs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:clamp(20px,4vw,48px)}
.mach{cursor:pointer;min-width:0}
.mach-h{display:flex;align-items:center;gap:9px;padding-bottom:6px;border-bottom:1px solid var(--hair)}
.mach-h b{font:500 13px var(--f-num)}
.mach-h .kind{font-size:12px;color:var(--muted)}
.mach-h .idle{margin-left:auto;font:400 11.5px var(--f-num);color:var(--muted)}
.mach.on .mach-h .dot{background:var(--accent);box-shadow:0 0 8px var(--accent)}
.mach.on .mach-h .idle{color:var(--accent)}
.spark{width:100%;height:38px;display:block;margin:10px 0 8px}
.np{display:grid;grid-template-columns:38px minmax(0,1fr) auto auto;gap:12px;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--hair)}
.cover{width:38px;height:38px;border-radius:6px;background:#151515}
.np .tt{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np .ar{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np .line{margin-top:6px}
.icon{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--sub);transition:background .2s,color .2s}
.icon:active{background:var(--sel);color:var(--text)}
.icon svg{width:18px;height:18px}
.np.empty{color:var(--muted);font-size:13px;grid-template-columns:1fr}
.controls{margin-top:22px}
.keys{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px;margin-top:8px}
.key{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 4px 10px;border-radius:12px;color:var(--sub);font-size:10.5px;transition:background .2s,color .2s;position:relative;overflow:hidden;text-align:center}
.key:hover{background:var(--sel)}
.key svg{width:20px;height:20px}
.key .n{font:300 20px var(--f-ui);line-height:20px;color:var(--text)}
.key.on{color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,transparent)}
.rip{position:absolute;width:16px;height:16px;border-radius:50%;background:var(--text);opacity:.18;transform:translate(-50%,-50%) scale(0);animation:rip .55s ease-out forwards;pointer-events:none}

/* ---------- claude ---------- */
.claude{grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr)}
.crab{width:100%;max-width:220px;aspect-ratio:2.4/1;display:block;image-rendering:pixelated}
.crab-say{font-weight:300;font-size:clamp(24px,3.4vw,36px);letter-spacing:-.02em;line-height:1.1;margin-top:6px}
.crab-say.alert{color:var(--rose)}
.usage{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;font-size:12.5px;color:var(--sub);margin-top:6px}
.usage .line{grid-column:1 / 3;margin-bottom:8px}
.usage .num{color:var(--text);font-size:12px}
.sess{padding:12px 0;border-bottom:1px solid var(--hair)}
.sess:last-child{border-bottom:0}
.sess-h{display:flex;align-items:center;gap:10px;min-width:0}
.sess-h code{font:500 13px var(--f-num);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sess-h .host-tag{font:400 11px var(--f-num);color:var(--muted)}
.sess-h .st{margin-left:auto;font-size:11.5px;color:var(--muted);white-space:nowrap}
.sess.working .dot{background:var(--teal);animation:soft 1.4s infinite}
.sess.working .st{color:var(--teal)}
.sess.waiting .dot{background:var(--rose);animation:ping 1.8s infinite}
.sess.waiting .st{color:var(--rose)}
.sess p{margin:5px 0 0 16px;font-size:13px;color:var(--sub)}
.sess p code{font-family:var(--f-num);color:var(--text);font-size:12.5px}
.sess .actions{margin:10px 0 0 16px}

/* ---------- dock ---------- */
.dock{display:flex;justify-content:center;gap:clamp(14px,4vw,34px);padding-top:8px;font-size:12px}
.dock button{color:var(--muted);padding:6px 2px;position:relative;transition:color .3s}
.dock button::after{content:"";position:absolute;left:50%;bottom:0;width:0;height:1.5px;background:var(--text);border-radius:2px;transform:translateX(-50%);transition:width .35s cubic-bezier(.22,.9,.24,1)}
.dock button.on{color:var(--text)}
.dock button.on::after{width:14px}
.badge{position:absolute;top:4px;right:-8px;width:5px;height:5px;border-radius:50%;background:var(--rose)}

/* ---------- overlays ---------- */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 52px);transform:translate(-50%,10px);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;background:#0d0d0d;box-shadow:inset 0 0 0 1px var(--faint);border-radius:10px;padding:10px 14px;font-size:12.5px;color:var(--sub);max-width:calc(100% - 40px);box-sizing:border-box;z-index:40}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.has-action.show{pointer-events:auto;display:flex;align-items:center;gap:14px}
.toast-btn{color:var(--accent);font-weight:500;font-size:12.5px;padding:2px 0}
.toast b{color:var(--text);font-weight:500}
.toast code{font:12px var(--f-num);color:var(--text);word-break:break-all}
.pop{position:fixed;width:5px;height:5px;margin:-2.5px;border-radius:50%;pointer-events:none;z-index:45;animation:pop .7s cubic-bezier(.2,.8,.3,1) forwards}

.athan{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(0,0,0,.94);cursor:pointer;animation:fade .7s ease-out;overflow:hidden}
.athan .ring{position:absolute;left:50%;top:50%;width:46vmin;height:46vmin;margin:-23vmin 0 0 -23vmin;border-radius:50%;box-shadow:inset 0 0 0 1px var(--sand);opacity:0;animation:ring 5s cubic-bezier(.2,.6,.3,1) infinite}
.athan .ring:nth-child(2){animation-delay:1.66s}
.athan .ring:nth-child(3){animation-delay:3.33s}
.athan-in{position:relative;text-align:center;padding:20px}
.athan-ar{font-family:var(--f-ar);font-weight:200;font-size:min(22vmin,160px);line-height:1.15;color:var(--sand)}
.athan-en{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--sub);margin-top:4px}
.athan-note{font-size:11.5px;color:var(--muted);margin-top:22px}

/* ---------- reminders ----------
   Three strengths, picked by how close a deadline is: a live "due soon" row on Home (and a pill under the
   idle clock), a line under the clock when something enters its window, and, in the last fifteen minutes,
   an alert that takes over the clock. Quiet mutes the last two; the Home row always stays. */
.g.soon .r{color:var(--text)}
.g.soon .bar i{background:var(--sub);transition:width 1s linear}
.g.soon.hot .k::before{content:"";display:inline-block;width:5px;height:5px;margin:0 6px 1px 0;border-radius:50%;background:var(--text);vertical-align:middle;animation:soft 1.6s infinite}
.g.soon .more{color:var(--muted);letter-spacing:0;text-transform:none;font-weight:400;margin-left:6px}
.pill{display:none;justify-content:center;margin-top:14px}
.app.idle .pill.on{display:flex}
.pill > span{display:inline-flex;align-items:center;gap:.55em;padding:6px 14px;border-radius:999px;background:rgba(0,0,0,.45);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);font:400 clamp(12px,1.5vw,16px)/1 var(--f-flip);letter-spacing:.08em;text-transform:uppercase;color:#fff;max-width:80vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:fade .8s}
.pill i{flex:none;width:5px;height:5px;border-radius:50%;background:#fff;animation:soft 1.8s infinite}
.pill b{font-weight:500}

/* a reminder is part of the clock: a line under it, in the clock's own thin uppercase type, no box.
   It arrives as a raindrop that falls from the top edge onto the line and splashes, and the line spreads
   out sideways from where it landed (dropIn); leaving plays that backwards (dropNote) */
.notes{display:flex;justify-content:center;min-width:0}
.notes:empty{display:none}
.note{display:flex;justify-content:center;max-width:100%;margin-top:18px}
.app.idle .note{margin-top:22px}
.nb{display:flex;flex-direction:column;align-items:center;min-width:0;max-width:100%}
.nl{display:flex;align-items:baseline;gap:.6em;max-width:100%;font:300 clamp(16px,2.1vw,24px)/1.15 var(--f-flip);letter-spacing:.08em;text-transform:uppercase;color:#fff;white-space:nowrap;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.nl .nd{flex:none;align-self:center;width:6px;height:6px;border-radius:50%;background:#fff;animation:soft 1.8s infinite}
.nl .nc{flex:none;color:rgba(255,255,255,.62)}
.nl .nt{min-width:0;overflow:hidden;text-overflow:ellipsis}
.nl .nk{flex:none;font-variant-numeric:tabular-nums}
.nl .nc::after,.nl .nt::after{content:"·";margin-left:.6em;opacity:.6}
.na{display:flex;justify-content:center;gap:4px;margin-top:4px}
.na button,.nudge-a button{font:400 clamp(13px,1.5vw,16px)/1 var(--f-flip);letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.55);padding:14px 14px;border-radius:999px;text-shadow:0 1px 8px rgba(0,0,0,.6);transition:color .2s,background .2s}
.na button:active,.nudge-a button:active{background:rgba(255,255,255,.08);color:#fff}
.na .ok,.nudge-a .ok{color:#fff}
/* the drop and its splash live on the page itself, so they can fall from the very top */
.raindrop{position:fixed;z-index:36;width:10px;height:15px;margin:-15px 0 0 -5px;border-radius:50% 50% 50% 50% / 62% 62% 38% 38%;background:rgba(235,235,235,.9);box-shadow:0 0 12px rgba(255,255,255,.3);pointer-events:none}
.rainsplash{position:fixed;z-index:36;width:26px;height:8px;margin:-4px 0 0 -13px;border-radius:50%;box-shadow:0 0 0 1px rgba(255,255,255,.6);pointer-events:none;opacity:0}
.stack:has(.note:not(.out)) .pill{display:none!important}

/* the alert, in the last fifteen minutes: the clock steps back and the deadline takes the line under it,
   large, with its countdown and the answers. A tap anywhere else is "got it" */
.nudge{display:flex;flex-direction:column;align-items:center;text-align:center;max-width:100%;margin-top:clamp(10px,3vh,24px);animation:fade .6s ease-out}
.nudge-k{display:flex;align-items:center;gap:.6em;font:400 clamp(13px,1.6vw,17px)/1 var(--f-flip);letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.7);text-shadow:0 1px 8px rgba(0,0,0,.6)}
.nudge-k i{width:7px;height:7px;border-radius:50%;background:#fff;animation:soft 1.4s infinite}
.nudge-k b{font-weight:400;color:#fff;font-variant-numeric:tabular-nums}
.nudge-k span:empty{display:none}
.nudge-t{max-width:100%;font:300 clamp(26px,4.6vw,52px)/1.08 var(--f-flip);color:#fff;margin-top:10px;letter-spacing:.04em;text-transform:uppercase;text-shadow:0 2px 14px rgba(0,0,0,.6);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nudge-c{font:300 clamp(13px,1.6vw,17px)/1 var(--f-flip);letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.6);margin-top:8px}
.nudge-c:empty{display:none}
.nudge-a{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;margin-top:8px}
.app.alerting .when,.app.alerting .pill,.app.alerting .notes{display:none!important}
.app.alerting .flipclock{--ch:min(34vh,30cqw);opacity:.75}
.app.idle.alerting #p-home{padding-block:0}
body:has(.app.alerting) #fauna{opacity:.4}

.quiet{display:flex;align-items:center;gap:5px;color:var(--sub);font:12px var(--f-num);animation:fade .4s}
.quiet svg{width:13px;height:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:8px 0 10px;border-top:1px solid var(--hair)}
.chips .lbl{width:100%;display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.chip{font-size:11.5px;padding:6px 11px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--faint);color:var(--sub);transition:background .2s,color .2s}
.chip.on{background:var(--text);color:#000;box-shadow:none}

.empty{color:var(--muted);font-size:13px;margin:10px 0}
.host.off,.mach.off{opacity:.4}
.key:disabled{opacity:.35}
.agents-row{display:flex;gap:8px;padding:2px 0 10px}
.agents-row input{flex:1;min-width:0;background:#000;color:var(--text);border:0;box-shadow:inset 0 0 0 1px var(--faint);border-radius:999px;padding:8px 12px;font:12px var(--f-num)}
.agents-row input:focus{outline:none;box-shadow:inset 0 0 0 1px var(--accent)}
.agents-row .btn{padding:7px 14px;font-size:12px}
.ver{font:10.5px var(--f-num);color:var(--muted);padding:8px 0 4px}
@keyframes soft{50%{opacity:.25}}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--rose) 60%,transparent)}100%{box-shadow:0 0 0 7px transparent}}
@keyframes rip{to{transform:translate(-50%,-50%) scale(12);opacity:0}}
@keyframes pop{to{transform:translate(var(--dx),var(--dy));opacity:0}}
@keyframes ring{0%{transform:scale(.4);opacity:0}15%{opacity:.7}100%{transform:scale(2.6);opacity:0}}
@keyframes fade{from{opacity:0}}

@media (max-aspect-ratio:1/1){
  .mode{display:none}
  .home,.cols,.claude{grid-template-columns:minmax(0,1fr)}
  .home{gap:36px}   /* room for the cat's back above its shelf */
  .flipclock{--ch:min(34vh,40cqw)}
  .app.idle .flipclock{--ch:min(52vh,40cqw)}
  .keys{grid-template-columns:repeat(5,minmax(0,1fr))}
}
@media (max-width:520px){
  .kv{grid-template-columns:repeat(2,minmax(0,1fr))}
  .net span{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>

</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div id="media" aria-hidden="true"><video muted loop playsinline hidden></video><img alt="" hidden></div>
<canvas id="fauna" aria-hidden="true"></canvas>
<canvas id="catLayer" aria-hidden="true"></canvas>

<div class="app" id="app" data-page="home">
  <header class="top">
    <div class="hosts" id="hosts"></div>
    <div class="status">
      <button class="quiet" id="quietBtn" type="button" hidden aria-label="Reminders are quiet. Tap to turn them back on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4.6A6 6 0 0 1 18 9.5c0 3 .7 5 1.5 6.5H8M6.2 7.5A6 6 0 0 0 6 9.5C6 13 5 15 4.5 16H8"/><path d="M10 20a2.2 2.2 0 0 0 4 0M3 3l18 18"/></svg><span id="quietTxt"></span></button>
      <span class="mini num" id="mini">--:--</span>
      <span class="net"><i id="netDot"></i><span id="netTxt">tailnet</span></span>
      <button class="menu-btn" id="menuBtn" type="button" aria-label="Display settings" aria-expanded="false" aria-controls="menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
    </div>
  </header>

  <main class="pager" id="pager">
    <div class="track" id="track">

      <!-- HOME -->
      <section class="page on" id="p-home" aria-label="Home"><div class="fit">
        <div class="home">
          <div class="clockblock" id="drift"><div class="stack">
            <div class="flipclock" id="clock" role="timer" aria-label="Time"><div class="roll" id="fH"><span class="dg"><i></i><i></i></span><span class="dg"><i></i><i></i></span></div><span class="sep" aria-hidden="true"></span><div class="roll" id="fM"><span class="dg"><i></i><i></i></span><span class="dg"><i></i><i></i></span></div></div>
            <div class="when"><span id="dateG"></span><span class="wp" id="whenP"><b id="wPn"></b><span id="wPt"></span><span class="cd" id="wPc"></span></span></div>
            <div class="pill" id="pill"><span><i></i><b id="pillW"></b><span id="pillT"></span></span></div>
            <div class="notes" id="notes" aria-live="polite"></div>
            <div class="nudge" id="nudge" role="alertdialog" aria-labelledby="nudgeT" hidden>
              <div class="nudge-k"><i></i><span id="nudgeK"></span><b id="nudgeCd"></b><span id="nudgeCdL"></span></div>
              <div class="nudge-t" id="nudgeT" dir="auto"></div>
              <div class="nudge-c" id="nudgeC"></div>
              <div class="nudge-a">
                <button class="ok" type="button" data-n="done" id="nudgeDone">Done</button>
                <button type="button" data-n="snooze">Snooze 10 min</button>
                <button type="button" data-n="mute">Don’t remind</button>
                <button type="button" data-n="quiet">Quiet 1 h</button>
                <button type="button" data-n="dismiss">Got it</button>
              </div>
            </div>
          </div></div>
          <nav class="glance" aria-label="At a glance">
            <div class="perch" id="perch" aria-hidden="true"></div>
            <button class="g prayer" id="gPrayer" type="button" data-go="athan">
              <span class="k" id="gPk">Prayer</span><span class="v" id="gPv"></span><span class="r num" id="gPr"></span>
              <span class="line bar"><i id="gPbar" style="width:0"></i></span>
            </button>
            <button class="g soon" id="gSoon" type="button" hidden><span class="k" id="gSk"></span><span class="v" id="gSv"></span><span class="r num" id="gSr"></span><span class="line bar"><i id="gSbar" style="width:0"></i></span></button>
            <button class="g" id="gTask" type="button" data-go="1" hidden><span class="k" id="gTk">Task</span><span class="v" id="gTv"></span><span class="r" id="gTr"></span></button>
            <button class="g" id="gNext" type="button" data-go="2" hidden><span class="k">Next up</span><span class="v" id="gCv"></span><span class="r num" id="gCr"></span></button>
            <button class="g" id="gClaude" type="button" data-go="4" hidden><span class="k">Claude</span><span class="v" id="gAv"></span><span class="r" id="gAr"></span></button>
          </nav>
        </div>
      </div></section>

      <!-- TASKS -->
      <section class="page panes" id="p-tasks" aria-label="Tasks"><div class="fit">
        <div class="cols">
          <div class="sec pane">
            <h2 class="sec-h">Dashboard <span class="src" id="tvSrc">taskvim</span></h2>
            <div class="scroller" id="taskGroups"></div>
          </div>
          <div class="pane">
            <div class="sec">
              <h2 class="sec-h">Today <span class="src" id="streakTxt"></span></h2>
              <div class="big num" id="goalBig"></div>
              <div class="line" style="margin-top:12px"><i id="goalLine" style="width:0;background:var(--green)"></i></div>
              <div class="heat" id="taskHeat" aria-label="Completions, last 16 weeks"></div>
            </div>
            <div class="sec pane">
              <h2 class="sec-h">Courses</h2>
              <div class="scroller" id="courses"></div>
            </div>
          </div>
        </div>
      </div></section>

      <!-- CALENDAR -->
      <section class="page panes" id="p-cal" aria-label="Calendar"><div class="fit">
        <div class="calcols">
          <div class="sec pane">
            <h2 class="sec-h"><span id="dayTitle">Today</span> <span class="src" id="calSrc">taskvim</span></h2>
            <div class="scroller" id="agenda"></div>
          </div>

  // Above a sea of clouds at golden hour: two mountain ranges breaking through, billowed cloud tops lit

  float rn(float x){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*(1.-abs(noise(vec2(x,1.))*2.-1.));x*=2.1;a*=.5;}return v;}

const DEFAULT_AGENTS = ['omarchy:8765', 'archlinux:8765'];

  return live.slice().sort((x, y) => x.state.idle - y.state.idle)[0] || null;
}

function source(key) {
  const live = agents.filter(a => a.ok && a.state?.[key]);
  if (key === 'taskvim') live.sort((x, y) => y.state.taskvim.mtime - x.state.taskvim.mtime);
  else { const act = activeAgent(); live.sort((x, y) => (y === act) - (x === act)); }
  if (live[0]) { const v = { data: live[0].state[key], host: nameOf(live[0]), addr: live[0].addr, live: true }; saveJSON('ss-cache-' + key, v); return v; }

  const a = agent || activeAgent();

  try {

/* ================= media scenes: a real clip or picture instead of a shader ================= */
// The file lives on a computer (~/.config/subscreen/scenes/<name>.mp4|webm|jpg|png|webp, served by the
// agent at /scene/<name>), never in the repo. The phone keeps its own copy in IndexedDB, so the scene
// still plays with every computer off, and re-downloads only when the file on the computer changes.
const MEDIA_SCENES = ['lumiere'];
const media = (() => {
  const box = $('#media'), vid = box.querySelector('video'), img = box.querySelector('img');
  let want = null, url = null, retry = 0, lastB = -1;
  const db = new Promise(ok => {
    try { const r = indexedDB.open('subscreen-media', 1); r.onupgradeneeded = () => r.result.createObjectStore('files'); r.onsuccess = () => ok(r.result); r.onerror = () => ok(null); }
    catch { ok(null); }
  });
  const idb = async (mode, fn) => { const d = await db; if (!d) return null;
    return new Promise(ok => { try { const q = fn(d.transaction('files', mode).objectStore('files')); q.onsuccess = () => ok(q.result ?? null); q.onerror = () => ok(null); } catch { ok(null); } }); };
  function show(rec) {
    if (url) URL.revokeObjectURL(url);
    url = URL.createObjectURL(rec.blob);
    const isVid = rec.blob.type.startsWith('video/');
    vid.hidden = !isVid; img.hidden = isVid;
    if (isVid) { img.removeAttribute('src'); vid.src = url; vid.play().catch(() => {}); }
    else { vid.removeAttribute('src'); vid.load(); img.src = url; }
  }
  async function fetchFrom(name, rec) {
    for (const a of agents) {
      try {
        const r = await fetch(`http://${a.addr}/scene/${name}`, { cache: 'no-store', headers: rec?.etag ? { 'If-None-Match': rec.etag } : {} });
        if (r.status === 304) return true;
        if (!r.ok) continue;
        const next = { blob: await r.blob(), etag: r.headers.get('ETag') || '' };
        await idb('readwrite', s => s.put(next, name));
        if (want === name) show(next);
        return true;
      } catch {}
    }
    return false;
  }
  async function use(name) {
    clearTimeout(retry);
    want = MEDIA_SCENES.includes(name) ? name : null;
    box.classList.toggle('on', !!want);
    if (!want) { vid.pause(); return; }
    const rec = await idb('readonly', s => s.get(name));
    if (want !== name) return;
    if (rec) show(rec);
    const got = await fetchFrom(name, rec);
    if (!got && !rec && want === name) {
      toast(`Put <b>${name}.mp4</b> (or .jpg) in ~/.config/subscreen/scenes on a computer`);
      retry = setTimeout(() => use(name), 30000);
    }
  }
  return {
    use,
    // the shaders dim themselves off the home page and while resting; the clip follows along
    frame(dim, resting) {
      if (!want) return;
      const b = Math.round((.75 + (.16 - .75) * dim) * 100) / 100;
      if (b !== lastB) { lastB = b; box.style.filter = `brightness(${b})`; }
      if (!vid.hidden && vid.src) { if (resting && !vid.paused) vid.pause(); else if (!resting && vid.paused) vid.play().catch(() => {}); }
    },
  };
})();

// restart). In a plain browser it falls back to Web Audio.
let actx = null, athanBuf = null, athanSrc = null, athanData = null;
async function startAthanSound() {
  actx = actx || new (window.AudioContext || window.webkitAudioContext)();
  const resumed = actx.resume();
  athanData = athanData || fetch('athan.mp3').then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); });
  if (!athanBuf) athanBuf = await actx.decodeAudioData((await athanData).slice(0));
  await resumed;
  stopAthanSound();
  const now = actx.currentTime;
  const src = actx.createBufferSource(); src.buffer = athanBuf;
  const boost = actx.createGain(); boost.gain.value = 4;
  const limit = actx.createDynamicsCompressor();
  limit.threshold.value = -1; limit.knee.value = 0; limit.ratio.value = 20; limit.attack.value = .002; limit.release.value = .2;
  const fade = actx.createGain(); fade.gain.setValueAtTime(0, now); fade.gain.linearRampToValueAtTime(1, now + 7);
  src.connect(boost); boost.connect(limit); limit.connect(fade); fade.connect(actx.destination);

// "Away" means no computer has been touched for N minutes (or none answers).
// Resting is true black with the brightness at its minimum; the page keeps

const restCfg = loadJSON('ss-rest', { auto: true, minutes: 10 });

let resting = false, sawAway = false, wokeAt = Date.now();

const CRAB = ['.XX.........XX.', 'X..X.......X..X', '.XX.........XX.', '...XXXXXXXXX...', '..XXEXXXXXEXX..', '..XXXXXXXXXXX..', '...XXXXXXXXX...'];
const LEGS = ['..X.X.X.X.X.X..', '.X.X.X.....X.X.'];
function drawCrab(t) {
  const c = $('#crab'); if (!c.getBoundingClientRect().width) return;
  fit(c);
  const x = c.getContext('2d'), W = c.width, H = c.height;
  x.clearRect(0, 0, W, H);
  const ps = Math.max(2, Math.floor(Math.min(W / 34, H / 11)));
  const waiting = allSessions().some(s => s.state === 'waiting');
  const walk = reduce ? 0 : Math.sin(t * .6) * (W / 2 - 9 * ps) * .8;
  const ox = Math.round(W / 2 - 7.5 * ps + walk), oy = Math.round(H - 9 * ps);
  const step = reduce ? 0 : Math.floor(t * 7) % 2;
  const snap = waiting && !reduce ? (Math.floor(t * 5) % 2 ? -ps : 0) : 0;
  const body = '#fab387';
  CRAB.forEach((row, ry) => {
    for (let cx = 0; cx < row.length; cx++) {
      const ch = row[cx]; if (ch === '.') continue;
      x.fillStyle = ch === 'E' ? '#000' : body;
      x.fillRect(ox + cx * ps, oy + ry * ps + (ry < 3 ? snap : 0), ps, ps);
    }
  });
  x.fillStyle = body;
  const legs = LEGS[step];
  for (let cx = 0; cx < legs.length; cx++) if (legs[cx] === 'X') x.fillRect(ox + cx * ps, oy + 7 * ps, ps, ps);
  x.fillStyle = '#1c1c1c'; x.fillRect(0, H - Math.max(1, ps / 3), W, Math.max(1, ps / 3));
}

/* ================= fit: a page shrinks to fit the screen, unless its lists scroll in their own boxes ================= */
function fitPages() {
  $$('.page').forEach(p => {
    const f = p.querySelector('.fit'); if (!f) return;
    f.style.transform = ''; f.style.width = ''; f.style.height = '';
    if (p.classList.contains('panes')) return;   // its lists scroll inside their own boxes instead of shrinking
    const cs = getComputedStyle(p);
    const avail = p.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    const need = f.scrollHeight;
    if (avail > 0 && need > avail + 1) {
      const k = avail / need;
      f.style.transform = `scale(${k})`; f.style.width = (100 / k) + '%'; f.style.height = need + 'px';
    }
  });
}

  resize(); addEventListener('resize', resize);

  function updateCat(t, dt, g, sleeping) {

    const lo = g.left + s * .45, hi = g.right - s * .45;

    const main = x, a0 = alphaNow; x = kc.getContext('2d'); x.clearRect(0, 0, W, H); alphaNow = 1; x.globalAlpha = 1;
    KOI.forEach(k => oneKoi(k, t));
    if (cr) {   // the fish swim under the clock: fade them there, feathered, so the digits stay clean
      x.save(); x.globalCompositeOperation = 'destination-out'; x.filter = `blur(${24 * D}px)`; x.fillStyle = 'rgba(0,0,0,.45)';
      x.fillRect((cr.left - 16) * D, (cr.top - 16) * D, (cr.width + 32) * D, (cr.height + 32) * D);
      const dk = !idleUI && $('#dock')?.getBoundingClientRect(); if (dk) x.fillRect((dk.left - 10) * D, (dk.top - 6) * D, (dk.width + 20) * D, (dk.height + 12) * D);
      const gl = !idleUI && $('.glance .g:not([hidden])') && $('#gPrayer').parentElement.getBoundingClientRect();   // and under the side panel's text
      if (gl && gl.width) x.fillRect((gl.left + 30) * D, (gl.top + 100) * D, (gl.width - 60) * D, (gl.height - 120) * D);
      x.restore();
    }
    x = main; alphaNow = a0; x.globalAlpha = a0;
    x.drawImage(kc, 0, 0);
  }

  // orbit: a space station sliding past, its solar wings catching the sun
  function satellite(t) {
    const P = 110, ph = t % P, dur = 70; if (ph > dur) return;
    const k = ph / dur, s = 7 * D, px = -50 * D + k * (W + 100 * D), py = H * (.05 + .06 * k);
    x.save(); x.translate(px, py); x.rotate(.16 + Math.sin(t * .05) * .02);
    x.fillStyle = '#9aa0ad'; x.fillRect(-s * 1.4, -s * .03, s * 2.8, s * .06);
    for (const sx of [-1.2, -.75, .75, 1.2]) for (const sy of [-1, 1]) {
      const g = x.createLinearGradient(0, sy * s * .08, 0, sy * s * .7);
      g.addColorStop(0, '#3a3220'); g.addColorStop(.5, '#a88a52'); g.addColorStop(1, '#30281a');
      x.fillStyle = g; x.fillRect(sx * s - s * .14, sy > 0 ? s * .08 : -s * .7, s * .28, s * .62);
    }
    x.fillStyle = '#6d7180'; x.fillRect(-s * .38, -s * .07, s * .76, s * .14);
    x.fillRect(-s * .06, -s * .3, s * .12, s * .6);
    x.fillStyle = '#7d808c'; x.fillRect(-s * .3, s * .1, s * .14, s * .28); x.fillRect(s * .16, -s * .38, s * .14, s * .28);
    const glint = Math.pow(Math.max(0, Math.sin(t * .35)), 30);
    if (glint > .01) { const g = x.createRadialGradient(0, 0, 0, 0, 0, s * 2.2); g.addColorStop(0, `rgba(255,245,220,${glint})`); g.addColorStop(1, 'rgba(255,245,220,0)'); x.fillStyle = g; x.beginPath(); x.arc(0, 0, s * 2.2, 0, Math.PI * 2); x.fill(); }
    if ((t % 1.6) < .12) { x.fillStyle = '#ff5050'; x.beginPath(); x.arc(s * 1.4, 0, 1.4 * D, 0, Math.PI * 2); x.fill(); }
    x.restore();
  }

  return {
    fx(scene, t) {
      if (scene === 'storm') return stormFx(t);
      return null;
    },
    frame(t, dt, page, scene, night, alpha, fx) {
      now = t; alphaNow = alpha; eyeCol = css('--accent') || '#94e2d5';
      x.clearRect(0, 0, W, H); cx.clearRect(0, 0, W, H);
      if (page !== 'home' || alpha < .02) { cat.box = null; return; }
      x.globalAlpha = alpha;
      if (scene === 'storm' && fx) bolt(fx);
      if (!enabled) { lyingCat(t); x.globalAlpha = 1; return; }
      if (scene === 'sunrise') { caravan(t); birds(t); }
      else if (scene === 'cloudsea') balloon(t);
      else if (scene === 'moonlit') geese(t);
      else if (scene === 'koi') koi(t);
      else if (scene === 'orbit') satellite(t);
      lyingCat(t);
      x.globalAlpha = 1;
    },
    tap(px, py) {
      const b = cat.box;
      if (!b || px < b.x || px > b.x + b.w || py < b.y || py > b.y + b.h) return false;
      cat.meow = now + 1.8;   // flicks its tail, then dozes off again
      return true;
    },
    setEnabled(v) { enabled = v; store.set('ss-animals', v ? '1' : '0'); },
    get enabled() { return enabled; },
    resetFont() {},
  };
})();
$('#animalsBtn').setAttribute('aria-pressed', String(fauna.enabled));
$('#animalsBtn').addEventListener('click', e => { fauna.setEnabled(!fauna.enabled); e.currentTarget.setAttribute('aria-pressed', String(fauna.enabled)); });
document.addEventListener('pointerup', e => { if (PAGES[pageIndex] === 'home' && menu.hidden) fauna.tap(e.clientX, e.clientY); });

let t = 0, last = performance.now(), dim = 0;
function frame(now) {
  if (resting) { last = now; media.frame(dim, true); return setTimeout(() => requestAnimationFrame(frame), 1000); }
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  t += dt * (reduce ? .05 : 1);
  dim += ((PAGES[pageIndex] === 'home' ? 0 : 1) - dim) * Math.min(1, dt * 3);
  const fx = fauna.fx(scene, t);
  if (sky) sky.draw(scene, t, dim, fx);
  media.frame(dim, false);
  if (PAGES[pageIndex] === 'claude') drawCrab(t);
  fauna.frame(t, dt, PAGES[pageIndex], scene, night, 1 - dim, fx);
  requestAnimationFrame(frame);
}

/* ================= boot ================= */
setScene(scene, true);
agents = loadJSON('ss-agents', DEFAULT_AGENTS).map(addr => ({ addr, state: null, ok: false, seen: 0, hist: [] }));
renderAll();
go(Math.max(0, PAGES.indexOf((location.hash || '').slice(1))), true);
fitPages();
if (document.fonts) document.fonts.ready.then(() => { fauna.resetFont(); fitPages(); });
function secondTick() { tickHome(new Date()); setTimeout(secondTick, 1000 - (Date.now() % 1000) + 8); }
secondTick();
let polling = false;
async function pollLoop() { if (!polling) { polling = true; try { await pollAll(); } finally { polling = false; } } }
pollLoop(); setInterval(pollLoop, 2000);
scheduleAthans();
if (native?.takePendingAthan) { const k = native.takePendingAthan(); if (k) setTimeout(() => window.athanFromAlarm(k), 400); }
requestAnimationFrame(frame);
addEventListener('resize', () => { fitPages(); if (PAGES[pageIndex] === 'machines') drawSparks(); });
})();
</script>
